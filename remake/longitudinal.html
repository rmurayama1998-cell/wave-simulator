<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>縦波と横波表示</title>
<style>
* {
	-moz-user-select: none;
	-ms-user-select: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-appearance: none;
}
html, body {
	margin: 0;
	padding: 0;
	overflow: hidden;
	width: 100%;
	height: 100%;
	background-color: #faf4ee;
}
button, html, body, li { touch-action: manipulation; }

canvas#myCanvas {
	display: block;
	position: fixed;
	top: 0; left: 0;
	width: 100%;
	height: 100%;
	background-color: #faf4ee;
}

#info, #info2 {
	position: fixed;
	left: 0;
	width: 100%;
	display: flex;
	flex-wrap: wrap;
	justify-content: center;
	align-items: center;
	gap: 8px 14px;
	padding: 0 12px;
	color: #4a4038;
}
#info  { bottom: 9vh; }
#info2 { bottom: 2vh; }

/* 関連するボタンをひとまとまりに見せる */
.grp {
	display: inline-flex;
	gap: 6px;
	padding: 4px 5px;
	background: rgba(74, 64, 56, 0.07);
	border-radius: 999px;
}

button {
	appearance: none;
	-webkit-appearance: none;
	padding: 0.36em 0.95em;
	border: 0;
	border-radius: 999px;
	background: #fffdfa;
	color: #4a4038;
	font-family: inherit;
	font-size: clamp(11px, 1.32vw, 20px);
	font-weight: 600;
	letter-spacing: 0.02em;
	line-height: 1.15;
	white-space: nowrap;
	cursor: pointer;
	box-shadow: 0 1px 2px rgba(90, 70, 50, 0.16);
	transition: background-color .16s ease, color .16s ease,
	            box-shadow .16s ease, transform .12s ease;
}
button:hover  { background: #ffffff; box-shadow: 0 3px 8px rgba(90, 70, 50, 0.22); }
button:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(90, 70, 50, 0.18); }
button:focus-visible { outline: 2px solid #8c7a66; outline-offset: 2px; }

/* 選択中のボタン */
button.on {
	background: #3f362e;
	color: #fff8f0;
	box-shadow: 0 3px 10px rgba(63, 54, 46, 0.34);
}
button.on:hover { background: #4a4038; }
</style>
</head>
<body>

<canvas id="myCanvas"></canvas>

<div id="info">
	<span class="grp">
		<button id="m1" onclick="setMenu(1)">進行波</button>
		<button id="m2" onclick="setMenu(2)">定常波</button>
		<button id="m3" onclick="setMenu(3)">変換のしくみ</button>
	</span>
	<span class="grp" id="arrowGrp">
		<button id="ar" onclick="toggleArrows()">変位の矢印</button>
	</span>
</div>

<div id="info2">
	<span class="grp" id="speedGrp">
		<button onclick="stop()">停止／再開</button>
		<button onclick="up()">描画速度↑</button>
		<button onclick="down()">描画速度↓</button>
	</span>
	<span class="grp" id="stepGrp">
		<button onclick="convReset()">最初から</button>
		<button onclick="convBack()">もどす</button>
		<button onclick="convNext()">1個すすめる</button>
		<button onclick="convAll()">最後まで</button>
	</span>
	<button onclick="buttonBack()">戻る</button>
</div>

<script>
"use strict";

/* ============================================================
   縦波と横波表示
   上：実際の縦波（媒質そのものが左右に振動する）
   下：横波表示（媒質の変位を縦にとったグラフ）
   仮想座標系 1366 x 768 を基準に、画面の高さに合わせて拡大する
   ============================================================ */

const cv  = document.getElementById("myCanvas");
const ctx = cv.getContext("2d");

const VW = 1366, VH = 768;      // 図の基準の大きさ
// 図が実際に使っている縦の範囲。ここが画面いっぱいになるように拡大する
const FIG_TOP = 95, FIG_BOT = 575;
const FIG_USE  = 0.80;          // 画面の高さのうち図に使う割合（残りはボタン）
const FIG_TOPM = 0.035;         // 図の上に空ける余白（画面の高さに対する割合）
const MR = 80;                  // 右の余白：x 軸の矢印より右に空ける
const VWmin = 850;              // 画面が細長いときでも、これだけの横幅は必ず見せる
let kx = 1, ky = 1;             // 仮想 -> 実ピクセルの倍率（縦横とも同じ値）
let offY = 0;                   // 図を上下の中央に置くためのずらし量
let VWv = VW;                   // いま画面に入っている図の横幅（仮想単位）

const PI = Math.PI, sin = Math.sin;

/* ---------- 配置（仮想座標） ---------- */
const MED_Y   = 235;            // 上：媒質が並ぶ線の高さ
const TRANS_Y = 490;            // 下：横波表示の x 軸の高さ
const UE      = 150;            // 縦線の上端
const SHITA   = 560;            // 縦線の下端

/* ---------- 波のパラメータ ---------- */
const ramda = 600;              // 波長 λ
const tt    = 8;                // 周期 T
const AMP   = 60;               // 振幅（媒質が左右に動く幅）
const dxs   = 50;               // 媒質の間隔
const x0    = 3 * dxs;          // 波の基準の位置（120）

const BG    = "#faf4ee";        // 背景（生成り色）
const AXIS  = "#000000";        // 座標軸・文字
const GRID  = "#999999";        // 目盛りの線
const GREEN = "#00b800";        // 媒質の粒

/* ---------- 変換のしくみ（授業用の固定設定） ---------- */
const CONV_Y   = 355;           // 変換を見せる線の高さ（図の中ほど）
const CONV_X0  = 90;            // いちばん左の媒質の位置
const CONV_N   = 16;            // 媒質の数は CONV_N + 1 個
const CONV_A   = 75;            // 変位の最大（矢印の長さ）
let CONV_LAM = 1000;            // 1波長ぶん。画面の横幅に合わせて決める
let CONV_GAP = CONV_LAM / CONV_N;
const C_RIGHT  = "#d94040";     // 右向きの変位
const C_LEFT   = "#2a6fd0";     // 左向きの変位
const CSTEP_MAX = 3 + CONV_N;   // ここまで進むと矢印の先を結ぶ

/* ---------- 状態 ---------- */
let t = 0;
let dt = 0.08;
let menu = 1;                   // 1:進行波 2:定常波 3:変換のしくみ
let paused = false;
let showArrows = false;         // 変位を矢印で見せるか

// 変換のしくみ用
let cstep = 0;                  // 0:等間隔 1:矢印 2〜:1個ずつ回転 最後:結ぶ
let dispP = 0;                  // 媒質を実際の位置へ動かす進みぐあい（0〜1）
let rotIdx = 0;                 // 何個目の矢印まで回し終えたか（小数）
let conn = 0;                   // 先を結ぶ線の進みぐあい（0〜1）
let cauto = false;              // 「最後まで」を押したか

/* ============================================================
   画面サイズ
   ============================================================ */
function resize() {
	const dpr = Math.min(window.devicePixelRatio || 1, 2);
	const w = cv.clientWidth  || window.innerWidth;
	const h = cv.clientHeight || window.innerHeight;
	cv.width  = Math.round(w * dpr);
	cv.height = Math.round(h * dpr);

	// 図が使っている縦の範囲が、画面の高さいっぱいになるように倍率を決める。
	// 縦と横で同じ倍率を使うので、波の形（振幅と波長の比）は変わらない
	let k = cv.height * FIG_USE / (FIG_BOT - FIG_TOP);
	// ただし横が狭くなりすぎないように、最低限の横幅は確保する
	k = Math.min(k, cv.width / (VWmin + MR));
	kx = k;
	ky = k;
	// 横は、画面に入るぶんだけ軸を伸ばす
	VWv = cv.width / k - MR;
	// 図の上端が、画面の上から FIG_TOPM のところに来るように置く
	offY = cv.height * FIG_TOPM - FIG_TOP * k;

	// 変換のしくみは、そのときの横幅にちょうど 1 波長が収まるようにする
	CONV_LAM = VWv - 2 * CONV_X0;
	CONV_GAP = CONV_LAM / CONV_N;

	draw();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", function () { setTimeout(resize, 300); });

/* ============================================================
   描画のための小道具
   ============================================================ */
function vSeg(vx, vy1, vy2, wid, col) {
	ctx.save();
	ctx.strokeStyle = col;
	ctx.lineWidth = wid * kx;
	ctx.beginPath();
	ctx.moveTo(vx * kx, vy1 * ky);
	ctx.lineTo(vx * kx, vy2 * ky);
	ctx.stroke();
	ctx.restore();
}

function hSeg(vy, vx1, vx2, wid, col) {
	ctx.save();
	ctx.strokeStyle = col;
	ctx.lineWidth = wid * kx;
	ctx.beginPath();
	ctx.moveTo(vx1 * kx, vy * ky);
	ctx.lineTo(vx2 * kx, vy * ky);
	ctx.stroke();
	ctx.restore();
}

// 右向きの矢印
function arrowRight(vx, vy) {
	const w = 128 * 0.15 * ky;
	const h = 128 * 0.20 * ky;
	const x = vx * kx, y = vy * ky;
	ctx.fillStyle = AXIS;
	ctx.beginPath();
	ctx.moveTo(x + h / 2, y);
	ctx.lineTo(x - h / 2, y - w / 2);
	ctx.lineTo(x - h / 2, y + w / 2);
	ctx.closePath();
	ctx.fill();
}

// 媒質の粒（緑の丸）
function dot(vx, vy, diaPx) {
	ctx.fillStyle = GREEN;
	ctx.beginPath();
	ctx.arc(vx * kx, vy * ky, diaPx / 2, 0, 2 * PI);
	ctx.fill();
}

// 見出し。線の上に重ねても読めるよう、背景色で下地を塗る
function title(str, vx, vy) {
	ctx.save();
	ctx.font = (26 * kx) + "px 'Meiryo', 'Hiragino Kaku Gothic ProN', sans-serif";
	ctx.textAlign = "left";
	ctx.textBaseline = "middle";
	const x = vx * kx, y = vy * ky;
	const w = ctx.measureText(str).width;
	const pad = 10 * kx;
	ctx.fillStyle = BG;
	ctx.fillRect(x - pad, y - 20 * ky, w + pad * 2, 40 * ky);
	ctx.fillStyle = AXIS;
	ctx.fillText(str, x, y);
	ctx.restore();
}

// 矢じりつきの矢印（座標は実ピクセル）
function arrowLine(x1, y1, x2, y2, col, widPx, alpha) {
	const ddx = x2 - x1, ddy = y2 - y1;
	const len = Math.hypot(ddx, ddy);
	if (len < 1) return;
	const ux = ddx / len, uy = ddy / len;
	const head = Math.min(len, 15 * kx);
	ctx.save();
	ctx.globalAlpha = alpha;
	ctx.strokeStyle = col;
	ctx.fillStyle = col;
	ctx.lineWidth = widPx;
	ctx.lineCap = "round";
	ctx.beginPath();
	ctx.moveTo(x1, y1);
	ctx.lineTo(x2 - ux * head * 0.75, y2 - uy * head * 0.75);
	ctx.stroke();
	ctx.beginPath();
	ctx.moveTo(x2, y2);
	ctx.lineTo(x2 - ux * head + uy * head * 0.45, y2 - uy * head - ux * head * 0.45);
	ctx.lineTo(x2 - ux * head - uy * head * 0.45, y2 - uy * head + ux * head * 0.45);
	ctx.closePath();
	ctx.fill();
	ctx.restore();
}

const clamp01 = function (v) { return v < 0 ? 0 : (v > 1 ? 1 : v); };
const ease = function (p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; };

/* ============================================================
   媒質の変位
   正の値を「左向きの変位」とする。こうすると横波表示では
   右向きの変位が上向きになり、教科書の決まりと一致する
   ============================================================ */
function disp(vx) {
	if (menu === 2) {   // 定常波：位置ごとに振れ幅が決まっていて、進まない
		return AMP * sin(2 * PI * (vx - x0) / ramda) * sin(2 * PI * t / tt);
	}
	return AMP * sin(2 * PI * (t / tt - (vx - x0) / ramda));   // 進行波
}

/* ============================================================
   背景（目盛りと軸）
   ============================================================ */
function drawStage() {
	// 背景は画面いっぱいに塗る
	ctx.setTransform(1, 0, 0, 1, 0, 0);
	ctx.fillStyle = BG;
	ctx.fillRect(0, 0, cv.width, cv.height);

	// ここから先は、上下の中央ぞろえ＋上の余白のぶんだけ下げて描く
	ctx.setTransform(1, 0, 0, 1, 0, offY);

	// λ/2 ごとの縦線。上下のグラフを貫いて、同じ位置どうしを結ぶ
	for (let vx = x0; vx <= VWv; vx += ramda / 2) {
		vSeg(vx, UE, SHITA, 1, GRID);
	}

	// 上：横波表示。振幅の目印と x 軸
	hSeg(TRANS_Y - AMP, 0, VWv, 1, GRID);
	hSeg(TRANS_Y + AMP, 0, VWv, 1, GRID);
	hSeg(TRANS_Y, 0, VWv, 1.5, AXIS);
	arrowRight(VWv - 10, TRANS_Y);

	// 下：媒質が並ぶ線
	hSeg(MED_Y, 0, VWv, 1.5, AXIS);
}

/* ============================================================
   本体の描画
   ============================================================ */
function draw() {
	if (menu === 3) { drawConv(); return; }
	drawStage();

	const dDot = 20 * kx;

	// 変位を矢印で見せる。もとの位置（輪）から、いまの位置へ向かう矢印
	if (showArrows) {
		for (let i = 0; i < VWv; i += dxs) {
			const u   = -disp(i);                 // 右向きを正とした変位
			const col = (u >= 0) ? C_RIGHT : C_LEFT;

			// 上：媒質のもとの位置を輪で示す
			ctx.save();
			ctx.strokeStyle = "#a99c8d";
			ctx.lineWidth = 1.4 * kx;
			ctx.beginPath();
			ctx.arc(i * kx, MED_Y * ky, 5 * kx, 0, 2 * PI);
			ctx.stroke();
			ctx.restore();

			const len = Math.abs(u) * kx;
			if (len > dDot / 2 + 3 * kx) {
				const dir = (u >= 0) ? 1 : -1;
				// 上：横向きの矢印（実際にどちらへどれだけ動いたか）
				arrowLine(i * kx, MED_Y * ky,
				          i * kx + u * kx - dir * dDot / 2, MED_Y * ky,
				          col, 2.2 * kx, 1);
				// 下：同じ変位を縦向きにしたもの（横波表示の値そのもの）
				arrowLine(i * kx, TRANS_Y * ky,
				          i * kx, (TRANS_Y - u) * ky + dir * dDot / 2,
				          col, 2.2 * kx, 1);
			}
		}
	}

	// 媒質の粒。上は実際にずれた位置の粒、下は変位を縦にとった点
	for (let i = -2 * dxs; i < VWv + 2 * dxs; i += dxs) {
		const fy = disp(i);
		dot(i - fy, MED_Y,        dDot);   // 実際の縦波：x がずれる、y は一定
		dot(i,      TRANS_Y + fy, dDot);   // 横波表示：x はそのまま、y が変位
	}
}

/* ============================================================
   見出しは玉より手前に描く
   ============================================================ */
function drawTitles() {
	if (menu === 3) return;
	title("実際の縦波（媒質が左右に動く）",   x0 + 10, 118);
	title("横波表示（変位を縦にとったもの）", x0 + 10, 398);
}

/* ============================================================
   変換のしくみ
   ① 媒質は等間隔 → ② 変位を横向きの矢印で表す
   → ③ 矢印を1個ずつ 90° 回す → ④ 先を結ぶと横波表示になる
   ============================================================ */
// 位置 x0 における、右向きを正とした変位
function convDisp(vx) {
	return CONV_A * sin(2 * PI * (vx - CONV_X0) / CONV_LAM);
}

function convStepText() {
	if (cstep === 0) return "① 媒質はもともと等間隔に並んでいる";
	if (cstep === 1) return "② 変位を横向きの矢印で表す（右向き＝赤、左向き＝青）";
	if (cstep < CSTEP_MAX) return "③ 矢印を 90° 回して縦向きにする（右→上、左→下）";
	return "④ 矢印の先を結ぶと、横波表示のグラフになる";
}

function drawConv() {
	// 背景
	ctx.setTransform(1, 0, 0, 1, 0, 0);
	ctx.fillStyle = BG;
	ctx.fillRect(0, 0, cv.width, cv.height);
	ctx.setTransform(1, 0, 0, 1, 0, offY);

	const right = CONV_X0 + CONV_LAM;

	// λ/4 ごとの目盛りと、媒質が並ぶ線
	for (let i = 0; i <= 4; i++) {
		vSeg(CONV_X0 + CONV_LAM / 4 * i, CONV_Y - 200, CONV_Y + 200, 1, GRID);
	}
	hSeg(CONV_Y - CONV_A, CONV_X0, right, 1, GRID);
	hSeg(CONV_Y + CONV_A, CONV_X0, right, 1, GRID);
	hSeg(CONV_Y, CONV_X0 - 40, right + 40, 1.5, AXIS);

	const dp = ease(dispP);
	const midY = CONV_Y * ky;

	for (let i = 0; i <= CONV_N; i++) {
		const vx  = CONV_X0 + i * CONV_GAP;
		const s   = convDisp(vx);                 // 右向きが正
		const mag = Math.abs(s) * kx;             // 矢印の長さ（実ピクセル）
		const col = (s >= 0) ? C_RIGHT : C_LEFT;
		const bx  = vx * kx;                      // もとの位置
		const px  = (vx + s * dp) * kx;           // いまの位置
		const p   = ease(clamp01(rotIdx - i));    // この矢印の回転の進みぐあい
		const turning = (rotIdx - i > 0) && (rotIdx - i < 1);

		// もとの位置（等間隔）を表す輪
		ctx.save();
		ctx.strokeStyle = "#a99c8d";
		ctx.lineWidth = 1.4 * kx;
		ctx.beginPath();
		ctx.arc(bx, midY, 5 * kx, 0, 2 * PI);
		ctx.stroke();
		ctx.restore();

		if (dp > 0 && mag > 1) {
			const a0 = (s >= 0) ? 0 : PI;             // 横向きのときの角度
			const a1 = (s >= 0) ? -PI / 2 : PI / 2;   // 縦向きになったときの角度
			const cur = mag * dp;

			// もとの横向きの矢印を薄く残す
			if (p > 0) arrowLine(bx, midY, bx + s * dp * kx, midY, col, 1.8 * kx, 0.22);

			// 回している最中は 90° の軌跡を点線で見せる
			if (turning) {
				ctx.save();
				ctx.strokeStyle = "rgba(60,50,40,0.40)";
				ctx.lineWidth = 1 * kx;
				ctx.setLineDash([4 * kx, 4 * kx]);
				ctx.beginPath();
				ctx.arc(bx, midY, cur, Math.min(a0, a1), Math.max(a0, a1));
				ctx.stroke();
				ctx.restore();
			}

			const ang = a0 + (a1 - a0) * p;
			arrowLine(bx, midY, bx + cur * Math.cos(ang), midY + cur * Math.sin(ang),
			          col, (turning ? 3.2 : 2.4) * kx, 1);
		}

		// 媒質そのもの
		ctx.fillStyle = GREEN;
		ctx.beginPath();
		ctx.arc(px, midY, 8 * kx, 0, 2 * PI);
		ctx.fill();
	}

	// ④ 矢印の先を結ぶ
	if (conn > 0) {
		ctx.save();
		ctx.strokeStyle = GREEN;
		ctx.lineWidth = 4 * kx;
		ctx.lineJoin = "round";
		ctx.lineCap = "round";
		ctx.beginPath();
		const last = CONV_X0 + CONV_LAM * conn;
		for (let vx = CONV_X0; vx <= last; vx += 4) {
			const y = (CONV_Y - convDisp(vx)) * ky;
			if (vx === CONV_X0) ctx.moveTo(vx * kx, y); else ctx.lineTo(vx * kx, y);
		}
		ctx.stroke();
		ctx.restore();
	}

	title(convStepText(), CONV_X0, CONV_Y - 215);
}

/* ---------- 変換のしくみ：時間を進める ---------- */
function convUpdate() {
	const f = 1 / 60;

	const dTarget = (cstep >= 1) ? 1 : 0;
	if (dispP !== dTarget) dispP = clamp01(dispP + Math.sign(dTarget - dispP) * f / 0.7);

	const rTarget = Math.max(0, Math.min(CONV_N + 1, cstep - 1));
	if (rotIdx < rTarget && dispP >= 1) {
		// 変位が 0 の媒質は回すものが無いので、さっと飛ばす
		const zero = Math.abs(convDisp(CONV_X0 + Math.floor(rotIdx) * CONV_GAP)) < 2;
		rotIdx = Math.min(rTarget, rotIdx + f / (zero ? 0.08 : 0.45));
	}
	if (rotIdx > rTarget) rotIdx = Math.max(rTarget, rotIdx - f / 0.12);

	const cTarget = (cstep >= CSTEP_MAX) ? 1 : 0;
	if (conn !== cTarget) conn = clamp01(conn + Math.sign(cTarget - conn) * f / 1.0);

	// いまの段階の動きが終わったら次へ。
	// 「dispP が 1 になったら」ではなく「いまの段階の目標に達したら」で判定する
	// （最初の状態は dispP が 0 のままなので、1 を待つと進まなくなる）
	if (cauto) {
		if (cstep >= CSTEP_MAX) cauto = false;
		else if (dispP === dTarget && rotIdx >= rTarget) cstep++;
	}
}

/* ============================================================
   時間を進める
   ============================================================ */
function animate() {
	draw();
	drawTitles();
	if (menu === 3) convUpdate();
	else if (!paused) t += dt;
	requestAnimationFrame(animate);
}

/* ============================================================
   ボタン
   ============================================================ */
function setMenu(n) {
	menu = n;
	t = 0;
	if (n === 3) convReset();
	markButtons();
	draw();
}

/* ---------- 変換のしくみの進め方 ---------- */
function convReset() { cstep = 0; dispP = 0; rotIdx = 0; conn = 0; cauto = false; }
function convNext()  { if (cstep < CSTEP_MAX) cstep++; cauto = false; }
function convBack()  { if (cstep > 0) cstep--; cauto = false; }
function convAll()   { cauto = true; }

function toggleArrows() { showArrows = !showArrows; markButtons(); draw(); }

function stop() { paused = !paused; }
function up()   { dt += 0.02; if (dt > 0.40) dt = 0.40; }
function down() { dt -= 0.02; if (dt < 0)    dt = 0; }

function buttonBack() { window.history.back(); }

function markButtons() {
	for (let n = 1; n <= 3; n++) {
		document.getElementById("m" + n).classList.toggle("on", menu === n);
	}
	// モードごとに、関係のあるボタンだけを出す
	const conv = (menu === 3);
	document.getElementById("ar").classList.toggle("on", showArrows);
	document.getElementById("arrowGrp").style.display = conv ? "none" : "";
	document.getElementById("speedGrp").style.display = conv ? "none" : "";
	document.getElementById("stepGrp").style.display  = conv ? "" : "none";
}

/* ---------- 画面をタップしたら全画面 ---------- */
cv.addEventListener("click", function () {
	if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
		document.documentElement.requestFullscreen().catch(function () {});
	}
});
document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
document.oncontextmenu = function () { return false; };

/* ---------- 開始 ---------- */
resize();
markButtons();
animate();
</script>
</body>
</html>
