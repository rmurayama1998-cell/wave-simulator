<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>弦の固有振動（基本・2倍・3倍振動の重ね合わせ）</title>
<style>
* {
	-moz-user-select: none;
	-ms-user-select: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-appearance: none;
}
html, body {
	margin: 0;
	padding: 0;
	overflow: hidden;
	width: 100%;
	height: 100%;
	background-color: #faf4ee;
}
button, html, body, li { touch-action: manipulation; }

canvas#myCanvas {
	display: block;
	position: fixed;
	top: 0; left: 0;
	width: 100%;
	height: 100%;
	background-color: #faf4ee;
}

#info, #info2 {
	position: fixed;
	left: 0;
	width: 100%;
	display: flex;
	flex-wrap: wrap;
	justify-content: center;
	align-items: center;
	gap: 8px 14px;
	padding: 0 12px;
	box-sizing: border-box;
	color: #4a4038;
}
#info  { bottom: 9vh; }
#info2 { bottom: 2vh; }

/* 関連するボタンをひとまとまりに見せる */
.grp {
	display: inline-flex;
	gap: 6px;
	padding: 4px 5px;
	background: rgba(74, 64, 56, 0.07);
	border-radius: 999px;
}

button {
	appearance: none;
	-webkit-appearance: none;
	padding: 0.36em 0.95em;
	border: 0;
	border-radius: 999px;
	background: #fffdfa;
	color: #4a4038;
	font-family: inherit;
	font-size: clamp(11px, 1.32vw, 20px);
	font-weight: 600;
	letter-spacing: 0.02em;
	line-height: 1.15;
	white-space: nowrap;
	cursor: pointer;
	box-shadow: 0 1px 2px rgba(90, 70, 50, 0.16);
	transition: background-color .16s ease, color .16s ease,
	            box-shadow .16s ease, transform .12s ease;
}
button:hover  { background: #ffffff; box-shadow: 0 3px 8px rgba(90, 70, 50, 0.22); }
button:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(90, 70, 50, 0.18); }
button:focus-visible { outline: 2px solid #8c7a66; outline-offset: 2px; }

/* 選択中のボタン */
button.on {
	background: #3f362e;
	color: #fff8f0;
	box-shadow: 0 3px 10px rgba(63, 54, 46, 0.34);
}
button.on:hover { background: #4a4038; }
</style>
</head>
<body>

<canvas id="myCanvas"></canvas>

<div id="info2">
	<span class="grp">
		<button onclick="stop()">停止／再開</button>
		<button onclick="up()">描画↑</button>
		<button onclick="down()">描画↓</button>
		<button onclick="restart()">最初から</button>
	</span>
	<button onclick="buttonBack()">戻る</button>
</div>

<script>
"use strict";

/* ============================================================
   弦の固有振動（基本・2倍・3倍振動の重ね合わせ）
   上に「すべての固有振動が重なった弦の振動」、
   下に基本振動・2倍振動・3倍振動を縦に並べる。
   上下とも同じ横幅・同じ振幅の倍率で描くので、下の3つを足すと上になる。
     n 倍振動 … y = sin(nπx) cos(nπt)   （x は弦の左端 0 〜 右端 1）
   仮想座標系 1366 x 768 を基準に、画面の高さに合わせて拡大する
   ============================================================ */

const cv  = document.getElementById("myCanvas");
const ctx = cv.getContext("2d");

const VW = 1366, VH = 768;
const MT = 50;                  // 上の余白
const VWmin = 1200;             // 画面が細長いときでも、これだけの横幅は必ず見せる
let k = 1;                      // 仮想 -> 実ピクセルの倍率
let offY = 0;
let VWv = VW;

const PI = Math.PI, sin = Math.sin, cos = Math.cos;

const MODES = [1, 2, 3];        // 並べる固有振動

/* ---------- 色 ---------- */
const BG    = "#faf4ee";
const GRID  = "#b8aea3";
const WALLC = "#4a4038";
const TEXT  = "#3f362e";
const SUB   = "#7a6e62";
const EIG   = "#0060d0";        // 1つずつの固有振動（青）
const GREEN = "#00a000";        // 重なった弦の振動（緑）
const NODE  = "#2a2ad0";        // 節の点

/* ---------- 状態 ---------- */
let t = 0;
const spdDef = 1;
let spd = spdDef;
let paused = false;
let lastNow = 0;

/* ============================================================
   画面サイズ
   ============================================================ */
function resize() {
	const dpr = Math.min(window.devicePixelRatio || 1, 2);
	const w = cv.clientWidth  || window.innerWidth;
	const h = cv.clientHeight || window.innerHeight;
	cv.width  = Math.round(w * dpr);
	cv.height = Math.round(h * dpr);
	k = Math.min(cv.height / (VH + MT), cv.width / VWmin);
	VWv = cv.width / k;
	offY = (cv.height - (VH + MT) * k) / 2;
	draw();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", function () { setTimeout(resize, 300); });

/* ============================================================
   波の変位
   ============================================================ */
function mode(n, x) { return sin(n * PI * x) * cos(n * PI * t); }

function total(x) {
	let s = 0;
	for (const n of MODES) s += mode(n, x);
	return s;
}

/* ============================================================
   描画のための小道具（仮想座標で受け取る）
   ============================================================ */
function line(x1, y1, x2, y2, wid, col, dash) {
	ctx.save();
	ctx.strokeStyle = col;
	ctx.lineWidth = wid * k;
	if (dash) ctx.setLineDash(dash.map(function (d) { return d * k; }));
	ctx.beginPath();
	ctx.moveTo(x1 * k, y1 * k);
	ctx.lineTo(x2 * k, y2 * k);
	ctx.stroke();
	ctx.restore();
}

function text(s, x, y, size, col, align, bold) {
	ctx.save();
	ctx.fillStyle = col;
	ctx.font = (bold ? "bold " : "") + (size * k) + "px 'Hiragino Kaku Gothic ProN','Meiryo',sans-serif";
	ctx.textAlign = align || "left";
	ctx.textBaseline = "middle";
	ctx.fillText(s, x * k, y * k);
	ctx.restore();
}

// 関数 f(x) (x: 0〜1) を、左端 X0・右端 X1・中心線 CY・倍率 A で描く
function curve(f, X0, X1, CY, A, wid, col) {
	ctx.save();
	ctx.strokeStyle = col;
	ctx.lineWidth = wid * k;
	ctx.lineCap = "round";
	ctx.lineJoin = "round";
	ctx.beginPath();
	const N = 300;
	for (let i = 0; i <= N; i++) {
		const x = i / N;
		const px = (X0 + (X1 - X0) * x) * k, py = (CY - A * f(x)) * k;
		if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
	}
	ctx.stroke();
	ctx.restore();
}

// 固定端（縦の棒＋斜線）
function wall(x, y1, y2, side) {
	ctx.save();
	ctx.strokeStyle = WALLC;
	ctx.lineWidth = 1.5 * k;
	for (let y = y1 + 4; y < y2; y += 14) {
		ctx.beginPath();
		ctx.moveTo(x * k, y * k);
		ctx.lineTo((x + side * 12) * k, (y + 12) * k);
		ctx.stroke();
	}
	ctx.restore();
	line(x, y1, x, y2, 6, WALLC);
}

function dot(x, y, col) {
	ctx.save();
	ctx.fillStyle = col;
	ctx.strokeStyle = "#ffffff";
	ctx.lineWidth = 2 * k;
	ctx.beginPath();
	ctx.arc(x * k, y * k, 7 * k, 0, 2 * PI);
	ctx.fill();
	ctx.stroke();
	ctx.restore();
}

/* ============================================================
   本体の描画
   ============================================================ */
function draw() {
	ctx.setTransform(1, 0, 0, 1, 0, 0);
	ctx.fillStyle = BG;
	ctx.fillRect(0, 0, cv.width, cv.height);
	ctx.setTransform(1, 0, 0, 1, 0, offY + MT * k);

	const X0 = 230, X1 = VWv - 70;
	const A = 44;                       // 1つの固有振動の振幅（重なると最大 3 倍）

	text("━ すべてが重なった弦の振動", 30, -22, 16, GREEN, "left", true);
	text("━ 固有振動（1つずつ）", 290, -22, 16, EIG, "left", true);

	// 上：すべての固有振動が重なった弦の振動
	const CY0 = 160, half0 = 140;
	text("すべての固有振動が", 30, CY0 - 22, 19, TEXT, "left", true);
	text("重なった弦の振動", 30, CY0 + 4, 19, TEXT, "left", true);
	text("（下の3つの和）", 30, CY0 + 32, 15, GREEN, "left", true);
	line(X0, CY0, X1, CY0, 1.5, GRID, [6, 6]);
	wall(X0, CY0 - half0, CY0 + half0, -1);
	wall(X1, CY0 - half0, CY0 + half0, 1);
	curve(total, X0, X1, CY0, A, 7, GREEN);
	line(30, 318, VWv - 30, 318, 1.5, "#d9cec1");

	// 下：基本振動・2倍振動・3倍振動
	const laneTop = 328, laneH = 124;
	MODES.forEach(function (n, i) {
		const CY = laneTop + laneH * (i + 0.5);
		const h = laneH * 0.42;
		if (i > 0) line(30, laneTop + laneH * i, VWv - 30, laneTop + laneH * i, 1, "#e3d9cd");
		line(X0, CY, X1, CY, 1, GRID, [5, 5]);
		line(X0, CY - h, X0, CY + h, 4, WALLC);
		line(X1, CY - h, X1, CY + h, 4, WALLC);
		curve(function (x) { return mode(n, x); }, X0, X1, CY, A, 4.5, EIG);
		for (let j = 0; j <= n; j++) dot(X0 + (X1 - X0) * j / n, CY, NODE);
		text(n === 1 ? "基本振動" : n + "倍振動", 30, CY - 12, 19, EIG, "left", true);
		text("L = " + n + " × λ/2　節 " + (n + 1) + " 個", 30, CY + 14, 14, SUB, "left");
	});
}

/* ============================================================
   時間を進める
   ============================================================ */
function animate(now) {
	if (!lastNow) lastNow = now;
	const dt = Math.min(0.05, (now - lastNow) / 1000);
	lastNow = now;
	if (!paused) t += dt * spd;
	draw();
	requestAnimationFrame(animate);
}

/* ============================================================
   ボタン
   ============================================================ */
function stop()    { paused = !paused; }
function up()      { spd = Math.min(4, spd + 0.25); }
function down()    { spd = Math.max(0, spd - 0.25); }
function restart() { t = 0; spd = spdDef; draw(); }
function buttonBack() { window.history.back(); }

/* ---------- 画面をタップしたら全画面 ---------- */
cv.addEventListener("click", function () {
	if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
		document.documentElement.requestFullscreen().catch(function () {});
	}
});
document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
document.oncontextmenu = function () { return false; };

/* ---------- 開始 ---------- */
resize();
requestAnimationFrame(animate);
</script>
</body>
</html>
