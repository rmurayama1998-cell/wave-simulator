<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>弦の固有振動（定常波になる波・ならない波）</title>
<style>
* {
	-moz-user-select: none;
	-ms-user-select: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-appearance: none;
}
html, body {
	margin: 0;
	padding: 0;
	overflow: hidden;
	width: 100%;
	height: 100%;
	background-color: #faf4ee;
}
button, html, body, li { touch-action: manipulation; }

canvas#myCanvas {
	display: block;
	position: fixed;
	top: 0; left: 0;
	width: 100%;
	height: 100%;
	background-color: #faf4ee;
}

#info, #info2 {
	position: fixed;
	left: 0;
	width: 100%;
	display: flex;
	flex-wrap: wrap;
	justify-content: center;
	align-items: center;
	gap: 8px 14px;
	padding: 0 12px;
	box-sizing: border-box;
	color: #4a4038;
}
#info  { bottom: 9vh; }
#info2 { bottom: 2vh; }

/* 関連するボタンをひとまとまりに見せる */
.grp {
	display: inline-flex;
	gap: 6px;
	padding: 4px 5px;
	background: rgba(74, 64, 56, 0.07);
	border-radius: 999px;
}

button {
	appearance: none;
	-webkit-appearance: none;
	padding: 0.36em 0.95em;
	border: 0;
	border-radius: 999px;
	background: #fffdfa;
	color: #4a4038;
	font-family: inherit;
	font-size: clamp(11px, 1.32vw, 20px);
	font-weight: 600;
	letter-spacing: 0.02em;
	line-height: 1.15;
	white-space: nowrap;
	cursor: pointer;
	box-shadow: 0 1px 2px rgba(90, 70, 50, 0.16);
	transition: background-color .16s ease, color .16s ease,
	            box-shadow .16s ease, transform .12s ease;
}
button:hover  { background: #ffffff; box-shadow: 0 3px 8px rgba(90, 70, 50, 0.22); }
button:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(90, 70, 50, 0.18); }
button:focus-visible { outline: 2px solid #8c7a66; outline-offset: 2px; }

/* 選択中のボタン */
button.on {
	background: #3f362e;
	color: #fff8f0;
	box-shadow: 0 3px 10px rgba(63, 54, 46, 0.34);
}
button.on:hover { background: #4a4038; }
</style>
</head>
<body>

<canvas id="myCanvas"></canvas>

<div id="info">
	<span class="grp">
		<button id="k1" onclick="setKind(1)">固有振動の波（定常波になる）</button>
		<button id="k2" onclick="setKind(2)">固有振動でない波（定常波にならない）</button>
	</span>
</div>

<div id="info2">
	<span class="grp">
		<button onclick="stop()">停止／再開</button>
		<button onclick="up()">描画↑</button>
		<button onclick="down()">描画↓</button>
		<button onclick="restart()">最初から</button>
	</span>
	<button onclick="buttonBack()">戻る</button>
</div>

<script>
"use strict";

/* ============================================================
   弦の固有振動（定常波になる波・ならない波）
   上に「3つの波が重なった弦の振動」、下にその3つの波を縦に並べる。
   上下とも同じ横幅・同じ振幅の倍率で描くので、下の3つを足すと上になる。
   ・固有振動の波 … n 倍振動 y = sin(nπx) cos(nπt)   （x は弦の左端 0 〜 右端 1）
   ・固有振動でない波（L = m × λ/2、m が整数でない）
       … 弦の上を往復する波を、1往復ぶんずつ全部重ね合わせる。
         往復のたびに位相がずれるので打ち消し合い、0 に近づく。
         往復した波の和は等比数列の和の公式で計算する。
         縦は「1本の振幅 × 2 × 往復回数」で割って、全部強め合ったときを 1 とする
   仮想座標系 1366 x 768 を基準に、画面の高さに合わせて拡大する
   ============================================================ */

const cv  = document.getElementById("myCanvas");
const ctx = cv.getContext("2d");

const VW = 1366, VH = 768;
const MT = 50;                  // 上の余白
const VWmin = 1200;             // 画面が細長いときでも、これだけの横幅は必ず見せる
let k = 1;                      // 仮想 -> 実ピクセルの倍率
let offY = 0;
let VWv = VW;

const PI = Math.PI, sin = Math.sin, cos = Math.cos;

const MODES = [1, 2, 3];        // 並べる固有振動
const NONM  = [1.3, 1.7, 2.4];  // 固有振動でない波（L = m × λ/2）
const RMAX  = 40;               // 往復回数の上限
const TRT   = 2;                // 1往復にかかる時間（弦の長さ L = 1、波の速さ 1）
const SHOWN_COPIES = 5;         // 細線で描く往復の数（最新のものから）

/* ---------- 色 ---------- */
const BG    = "#faf4ee";
const GRID  = "#b8aea3";
const WALLC = "#4a4038";
const TEXT  = "#3f362e";
const SUB   = "#7a6e62";
const EIG   = "#0060d0";        // 1つずつの固有振動（青）
const GREEN = "#00a000";        // 重なった弦の振動（緑）
const NODE  = "#2a2ad0";        // 節の点
const NON   = "#e07000";        // 固有振動でない波（オレンジ）

/* ---------- 状態 ---------- */
let kind = 1;                   // 1:固有振動の波 2:固有振動でない波
let t = 0;
const spdDef = 1;
let spd = spdDef;
let paused = false;
let lastNow = 0;

/* ============================================================
   画面サイズ
   ============================================================ */
function resize() {
	const dpr = Math.min(window.devicePixelRatio || 1, 2);
	const w = cv.clientWidth  || window.innerWidth;
	const h = cv.clientHeight || window.innerHeight;
	cv.width  = Math.round(w * dpr);
	cv.height = Math.round(h * dpr);
	k = Math.min(cv.height / (VH + MT), cv.width / VWmin);
	VWv = cv.width / k;
	offY = (cv.height - (VH + MT) * k) / 2;
	draw();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", function () { setTimeout(resize, 300); });

/* ============================================================
   波の変位
   ============================================================ */
function mode(n, x) { return sin(n * PI * x) * cos(n * PI * t); }

function total(x) {
	let s = 0;
	for (const n of MODES) s += mode(n, x);
	return s;
}

const R = function () { return Math.min(RMAX, 1 + Math.floor(t / TRT)); };

// j 往復目の右へ進む波と、それが右端で反射した左へ進む波（固定端で上下反転）
function right(m, j, x) { return sin(PI * m * x - PI * m * t + j * 2 * PI * m); }
function left(m, j, x)  { return -sin(PI * m * (2 - x) - PI * m * t + j * 2 * PI * m); }

// sin(a) + sin(a+φ) + … + sin(a+(r-1)φ)  （等比数列の和）
function sinSum(a, phi, r) {
	const s = sin(phi / 2);
	if (Math.abs(s) < 1e-9) return r * sin(a);
	return sin(a + (r - 1) * phi / 2) * sin(r * phi / 2) / s;
}

// r 往復ぶんの波をすべて重ね合わせ、往復回数×2 で割った変位
function nonResult(m, x) {
	const r = R(), phi = 2 * PI * m;
	return (sinSum(PI * m * x - PI * m * t, phi, r)
	      - sinSum(PI * m * (2 - x) - PI * m * t, phi, r)) / (2 * r);
}

function nonTotal(x) {
	let s = 0;
	for (const m of NONM) s += nonResult(m, x);
	return s;
}

/* ============================================================
   描画のための小道具（仮想座標で受け取る）
   ============================================================ */
function line(x1, y1, x2, y2, wid, col, dash) {
	ctx.save();
	ctx.strokeStyle = col;
	ctx.lineWidth = wid * k;
	if (dash) ctx.setLineDash(dash.map(function (d) { return d * k; }));
	ctx.beginPath();
	ctx.moveTo(x1 * k, y1 * k);
	ctx.lineTo(x2 * k, y2 * k);
	ctx.stroke();
	ctx.restore();
}

function text(s, x, y, size, col, align, bold) {
	ctx.save();
	ctx.fillStyle = col;
	ctx.font = (bold ? "bold " : "") + (size * k) + "px 'Hiragino Kaku Gothic ProN','Meiryo',sans-serif";
	ctx.textAlign = align || "left";
	ctx.textBaseline = "middle";
	ctx.fillText(s, x * k, y * k);
	ctx.restore();
}

// 関数 f(x) (x: 0〜1) を、左端 X0・右端 X1・中心線 CY・倍率 A で描く
function curve(f, X0, X1, CY, A, wid, col, alpha) {
	ctx.save();
	ctx.globalAlpha = (alpha === undefined) ? 1 : alpha;
	ctx.strokeStyle = col;
	ctx.lineWidth = wid * k;
	ctx.lineCap = "round";
	ctx.lineJoin = "round";
	ctx.beginPath();
	const N = 300;
	for (let i = 0; i <= N; i++) {
		const x = i / N;
		const px = (X0 + (X1 - X0) * x) * k, py = (CY - A * f(x)) * k;
		if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
	}
	ctx.stroke();
	ctx.restore();
}

// 固定端（縦の棒＋斜線）
function wall(x, y1, y2, side) {
	ctx.save();
	ctx.strokeStyle = WALLC;
	ctx.lineWidth = 1.5 * k;
	for (let y = y1 + 4; y < y2; y += 14) {
		ctx.beginPath();
		ctx.moveTo(x * k, y * k);
		ctx.lineTo((x + side * 12) * k, (y + 12) * k);
		ctx.stroke();
	}
	ctx.restore();
	line(x, y1, x, y2, 6, WALLC);
}

function dot(x, y, col) {
	ctx.save();
	ctx.fillStyle = col;
	ctx.strokeStyle = "#ffffff";
	ctx.lineWidth = 2 * k;
	ctx.beginPath();
	ctx.arc(x * k, y * k, 7 * k, 0, 2 * PI);
	ctx.fill();
	ctx.stroke();
	ctx.restore();
}

/* ============================================================
   本体の描画
   ============================================================ */
function draw() {
	ctx.setTransform(1, 0, 0, 1, 0, 0);
	ctx.fillStyle = BG;
	ctx.fillRect(0, 0, cv.width, cv.height);
	ctx.setTransform(1, 0, 0, 1, 0, offY + MT * k);

	const X0 = 330, X1 = VWv - 70;
	const A = 42;                       // 1つの波の振幅（重なると最大 3 倍）
	const FS = 30;                      // 左の文字の大きさ
	const eig = (kind === 1);
	const COL = eig ? EIG : NON;

	text("━ 3つの波が重なった弦の振動", 30, -24, 18, GREEN, "left", true);
	text(eig ? "━ 固有振動（1つずつ）" : "━ 固有振動でない波（1つずつ）", 330, -24, 18, COL, "left", true);
	if (!eig) text("往復回数  " + R() + " 回" + (R() === RMAX ? "（上限）" : ""), X1, -24, 22, TEXT, "right", true);

	// 弦の長さ L（寸法線）
	const DY = 14;
	line(X0, DY - 12, X0, DY + 12, 2, TEXT);
	line(X1, DY - 12, X1, DY + 12, 2, TEXT);
	dimArrow(X0, X1, DY);
	const mid = (X0 + X1) / 2;
	ctx.save();
	ctx.fillStyle = BG;
	ctx.fillRect((mid - 110) * k, (DY - 18) * k, 220 * k, 36 * k);
	ctx.restore();
	text("弦の長さ L", mid, DY, 26, TEXT, "center", true);

	// 上：3つの波が重なった弦の振動
	const CY0 = 172, half0 = 132;
	if (eig) {
		text("すべての", 30, CY0 - 52, FS, TEXT, "left", true);
		text("固有振動が", 30, CY0 - 14, FS, TEXT, "left", true);
		text("重なった振動", 30, CY0 + 24, FS, TEXT, "left", true);
	} else {
		text("固有振動で", 30, CY0 - 52, FS, TEXT, "left", true);
		text("ない波が", 30, CY0 - 14, FS, TEXT, "left", true);
		text("重なった振動", 30, CY0 + 24, FS, TEXT, "left", true);
	}
	text("（下の3つの和）", 30, CY0 + 62, 22, GREEN, "left", true);
	line(X0, CY0, X1, CY0, 1.5, GRID, [6, 6]);
	wall(X0, CY0 - half0, CY0 + half0, -1);
	wall(X1, CY0 - half0, CY0 + half0, 1);
	curve(eig ? total : nonTotal, X0, X1, CY0, A, 7, GREEN);
	line(30, 318, VWv - 30, 318, 1.5, "#d9cec1");

	// 下：3つの波を1つずつ
	const laneTop = 326, laneH = 112;
	const list = eig ? MODES : NONM;
	list.forEach(function (m, i) {
		const CY = laneTop + laneH * (i + 0.5);
		const h = laneH * 0.44;
		if (i > 0) line(30, laneTop + laneH * i, VWv - 30, laneTop + laneH * i, 1, "#e3d9cd");
		line(X0, CY, X1, CY, 1, GRID, [5, 5]);
		line(X0, CY - h, X0, CY + h, 4, WALLC);
		line(X1, CY - h, X1, CY + h, 4, WALLC);
		if (eig) {
			curve(function (x) { return mode(m, x); }, X0, X1, CY, A, 4.5, EIG);
			for (let j = 0; j <= m; j++) dot(X0 + (X1 - X0) * j / m, CY, NODE);
			text(m === 1 ? "基本振動" : m + "倍振動", 30, CY - 22, FS, EIG, "left", true);
			lambdaText(m, 30, CY + 24, FS);
		} else {
			// 往復している波（細線）と、それを全部重ね合わせた結果（太線）
			const r = R();
			for (let j = Math.max(0, r - SHOWN_COPIES); j < r; j++) {
				curve(function (x) { return right(m, j, x); }, X0, X1, CY, A, 1.5, NON, 0.22);
				curve(function (x) { return left(m, j, x); },  X0, X1, CY, A, 1.5, NON, 0.22);
			}
			curve(function (x) { return nonResult(m, x); }, X0, X1, CY, A, 4.5, NON);
			text("L = " + m + " × λ/2", 30, CY - 22, FS, NON, "left", true);
			text("λ ≒ " + (2 / m).toFixed(2) + "L", 30, CY + 24, FS, TEXT, "left", true);
		}
	});
}

// 両向き矢印の寸法線
function dimArrow(x1, x2, y) {
	line(x1, y, x2, y, 2, TEXT);
	ctx.save();
	ctx.fillStyle = TEXT;
	for (const [x, s] of [[x1, 1], [x2, -1]]) {
		ctx.beginPath();
		ctx.moveTo(x * k, y * k);
		ctx.lineTo((x + s * 16) * k, (y - 7) * k);
		ctx.lineTo((x + s * 16) * k, (y + 7) * k);
		ctx.closePath();
		ctx.fill();
	}
	ctx.restore();
}

// 波長 λ = 2L/n を書く（割り切れないときは分数で）
function lambdaText(n, x, y, size) {
	const head = "λ = ";
	if (n === 1 || n === 2) { text(head + (n === 1 ? "2L" : "L"), x, y, size, TEXT, "left", true); return; }
	text(head, x, y, size, TEXT, "left", true);
	ctx.save();
	ctx.font = "bold " + (size * k) + "px 'Hiragino Kaku Gothic ProN','Meiryo',sans-serif";
	const w0 = ctx.measureText(head).width / k;
	ctx.restore();
	const fx = x + w0 + 4, fw = size * 1.3, fs = size * 0.8;
	text("2L", fx + fw / 2, y - size * 0.45, fs, TEXT, "center", true);
	line(fx, y, fx + fw, y, 2.5, TEXT);
	text(String(n), fx + fw / 2, y + size * 0.47, fs, TEXT, "center", true);
}

/* ============================================================
   時間を進める
   ============================================================ */
function animate(now) {
	if (!lastNow) lastNow = now;
	const dt = Math.min(0.05, (now - lastNow) / 1000);
	lastNow = now;
	if (!paused) t += dt * spd;
	draw();
	requestAnimationFrame(animate);
}

/* ============================================================
   ボタン
   ============================================================ */
function stop()    { paused = !paused; }
function up()      { spd = Math.min(4, spd + 0.25); }
function down()    { spd = Math.max(0, spd - 0.25); }
function restart() { t = 0; spd = spdDef; draw(); }
function setKind(n) { kind = n; t = 0; markButtons(); draw(); }
function markButtons() {
	for (let n = 1; n <= 2; n++) document.getElementById("k" + n).classList.toggle("on", kind === n);
}
function buttonBack() { window.history.back(); }

/* ---------- 画面をタップしたら全画面 ---------- */
cv.addEventListener("click", function () {
	if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
		document.documentElement.requestFullscreen().catch(function () {});
	}
});
document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
document.oncontextmenu = function () { return false; };

/* ---------- 開始 ---------- */
markButtons();
resize();
requestAnimationFrame(animate);
</script>
</body>
</html>
