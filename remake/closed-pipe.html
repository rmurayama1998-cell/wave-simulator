<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>閉管の共鳴（基本振動・3倍振動・5倍振動）</title>
<style>
* {
	-moz-user-select: none;
	-ms-user-select: none;
	-webkit-user-select: none;
	user-select: none;
}
html, body {
	margin: 0;
	padding: 0;
	overflow: hidden;
	width: 100%;
	height: 100%;
	background-color: #faf4ee;
}
button, html, body, li { touch-action: manipulation; }

canvas#myCanvas {
	display: block;
	position: fixed;
	top: 0; left: 0;
	width: 100%;
	height: 100%;
	background-color: #faf4ee;
}

#info, #info2 {
	position: fixed;
	left: 0;
	width: 100%;
	display: flex;
	flex-wrap: wrap;
	justify-content: center;
	align-items: center;
	gap: 8px 14px;
	padding: 0 12px;
	box-sizing: border-box;
	color: #4a4038;
}
#info  { bottom: 9vh; }
#info2 { bottom: 2vh; }

/* 関連するボタンをひとまとまりに見せる */
.grp {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	padding: 4px 5px;
	background: rgba(74, 64, 56, 0.07);
	border-radius: 999px;
}

button {
	appearance: none;
	-webkit-appearance: none;
	padding: 0.36em 0.95em;
	border: 0;
	border-radius: 999px;
	background: #fffdfa;
	color: #4a4038;
	font-family: inherit;
	font-size: clamp(11px, 1.32vw, 20px);
	font-weight: 600;
	letter-spacing: 0.02em;
	line-height: 1.15;
	white-space: nowrap;
	cursor: pointer;
	box-shadow: 0 1px 2px rgba(90, 70, 50, 0.16);
	transition: background-color .16s ease, color .16s ease,
	            box-shadow .16s ease, transform .12s ease;
}
button:hover  { background: #ffffff; box-shadow: 0 3px 8px rgba(90, 70, 50, 0.22); }
button:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(90, 70, 50, 0.18); }
button:focus-visible { outline: 2px solid #8c7a66; outline-offset: 2px; }

/* 選択中のボタン */
button.on {
	background: #3f362e;
	color: #fff8f0;
	box-shadow: 0 3px 10px rgba(63, 54, 46, 0.34);
}
button.on:hover { background: #4a4038; }

/* スライダー */
.lbl {
	font-size: clamp(11px, 1.25vw, 19px);
	font-weight: 600;
	padding-left: 8px;
	white-space: nowrap;
}
.val {
	display: inline-block;
	min-width: 4.4em;
	text-align: right;
	font-size: clamp(11px, 1.25vw, 19px);
	font-weight: 700;
	padding-right: 8px;
	font-variant-numeric: tabular-nums;
}
input[type=range] {
	-webkit-appearance: none;
	appearance: none;
	width: clamp(90px, 13vw, 220px);
	height: 30px;
	margin: 0;
	background: transparent;
	touch-action: none;
}
input[type=range]::-webkit-slider-runnable-track {
	height: 6px;
	border-radius: 3px;
	background: #d9cec1;
}
input[type=range]::-webkit-slider-thumb {
	-webkit-appearance: none;
	width: 26px;
	height: 26px;
	margin-top: -10px;
	border-radius: 50%;
	background: #3f362e;
	border: 3px solid #fffdfa;
	box-shadow: 0 1px 3px rgba(63, 54, 46, 0.4);
}
input[type=range]::-moz-range-track {
	height: 6px;
	border-radius: 3px;
	background: #d9cec1;
}
input[type=range]::-moz-range-thumb {
	width: 22px;
	height: 22px;
	border-radius: 50%;
	background: #3f362e;
	border: 3px solid #fffdfa;
}
</style>
</head>
<body>

<canvas id="myCanvas"></canvas>

<div id="info">
	<span class="grp">
		<button id="m1" onclick="setMenu(1)">管の共鳴</button>
		<button id="m2" onclick="setMenu(2)">基本振動</button>
		<button id="m3" onclick="setMenu(3)">3倍振動</button>
		<button id="m4" onclick="setMenu(4)">5倍振動</button>
	</span>
	<span class="grp">
		<button id="bTate" onclick="toggleTate()">縦波で表示</button>
		<button id="bNode" onclick="toggleNode()">節・腹</button>
	</span>
	<span class="grp">
		<button onclick="stop()">停止／再開</button>
		<button onclick="up()">描画↑</button>
		<button onclick="down()">描画↓</button>
	</span>
</div>

<div id="info2">
	<span class="grp">
		<button id="bSound" onclick="toggleSound()">🔈 音を鳴らす</button>
		<span class="lbl">音量</span>
		<input id="vol" type="range" min="0" max="1" step="0.01" value="0.3" oninput="changeVol()">
		<span class="val" id="volVal">0.30</span>
	</span>
	<span class="grp">
		<span class="lbl">基本振動数</span>
		<input id="freq" type="range" min="50" max="1000" step="1" value="220" oninput="changeFreq()">
		<span class="val" id="freqVal">220 Hz</span>
	</span>
	<button onclick="buttonBack()">戻る</button>
</div>

<script>
"use strict";

/* ============================================================
   閉管の共鳴
   左端が閉じた端、右端が開いた端（スピーカーを置く）。
   上から ① 管の共鳴（基本・3倍・5倍振動が重なった振動）
          ② 基本振動 ③ 3倍振動 ④ 5倍振動 を並べる。
   n 倍振動（n = 1, 3, 5）の変位  y = sin(nπx/2) cos(nωt)   （x は閉端 0 〜 開端 1）
     → 閉端 x = 0 は必ず節、開端 x = 1 は必ず腹。L = n × λ/4
   「縦波で表示」では、管の中の空気の粒を変位の分だけ左右に動かす。
   見た目の振動はゆっくりしたデモ用の速さで、音は本当の振動数で鳴らす。
   仮想座標系 1366 x 768 を基準に、画面の高さに合わせて拡大する
   ============================================================ */

const cv  = document.getElementById("myCanvas");
const ctx = cv.getContext("2d");

const VW = 1366, VH = 768;
const VWmin = 1200;             // 画面が細長いときでも、これだけの横幅は必ず見せる
let k = 1;                      // 仮想 -> 実ピクセルの倍率
let offY = 0;
let VWv = VW;

const PI = Math.PI, sin = Math.sin, cos = Math.cos;

const ROWS = [0, 1, 3, 5];      // 0 は「管の共鳴」（1・3・5倍振動の和）
const ROWY = [92, 238, 384, 530];
const IN   = 44;                // 管の内側の半分の太さ
const AMP  = 38;                // 変位の振幅（管の内側に収まる）
const WT   = 9;                 // 管の壁の厚さ
const VIS_F = 0.5;              // 見た目の基本振動の振動数（デモ用）
const PSTEP = 1 / 32;          // 縦波で表示するときの粒の間隔（管の長さを 1 として）

/* ---------- 色 ---------- */
const BG    = "#faf4ee";
const GRID  = "#b8aea3";
const TUBE  = "#c79a5c";        // 管の壁
const INNER = "#fffaf3";        // 管の中
const TEXT  = "#3f362e";
const SUB   = "#7a6e62";
const WAVE  = "#0060d0";        // 1つずつの振動（青）
const GREEN = "#00a000";        // 重なった振動（緑）
const ANTI  = "#e00000";        // 腹（赤玉）
const NODE  = "#2a2ad0";        // 節（青玉）
const AIR   = "#e07000";        // 空気の粒（オレンジ）

/* ---------- 状態 ---------- */
let menu = 4;                   // 何段目まで見せるか（音もその段を鳴らす）
let tate = false;               // 縦波で表示
let showNode = true;            // 節・腹の印
let t = 0;
const spdDef = 1;
let spd = spdDef;
let paused = false;
let lastNow = 0;
let f1 = 220;                   // 基本振動数 [Hz]
let volume = 0.3;

/* ============================================================
   画面サイズ
   ============================================================ */
function resize() {
	const dpr = Math.min(window.devicePixelRatio || 1, 2);
	const w = cv.clientWidth  || window.innerWidth;
	const h = cv.clientHeight || window.innerHeight;
	cv.width  = Math.round(w * dpr);
	cv.height = Math.round(h * dpr);
	k = Math.min(cv.height / VH, cv.width / VWmin);
	VWv = cv.width / k;
	offY = (cv.height - VH * k) / 2;
	draw();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", function () { setTimeout(resize, 300); });

/* ============================================================
   空気の変位（x: 閉端 0 〜 開端 1、結果は -1〜1）
   ============================================================ */
function mode(n, x) { return sin(n * PI * x / 2) * cos(2 * PI * n * VIS_F * t); }

function disp(row, x) {
	if (row === 0) return (mode(1, x) + mode(3, x) + mode(5, x)) / 3;
	return mode(row, x);
}

/* ============================================================
   描画のための小道具（仮想座標で受け取る）
   ============================================================ */
function line(x1, y1, x2, y2, wid, col, dash) {
	ctx.save();
	ctx.strokeStyle = col;
	ctx.lineWidth = wid * k;
	if (dash) ctx.setLineDash(dash.map(function (d) { return d * k; }));
	ctx.beginPath();
	ctx.moveTo(x1 * k, y1 * k);
	ctx.lineTo(x2 * k, y2 * k);
	ctx.stroke();
	ctx.restore();
}

function rect(x, y, w, h, col) {
	ctx.fillStyle = col;
	ctx.fillRect(x * k, y * k, w * k, h * k);
}

function text(s, x, y, size, col, align, bold) {
	ctx.save();
	ctx.fillStyle = col;
	ctx.font = (bold ? "bold " : "") + (size * k) + "px 'Hiragino Kaku Gothic ProN','Meiryo',sans-serif";
	ctx.textAlign = align || "left";
	ctx.textBaseline = "middle";
	ctx.fillText(s, x * k, y * k);
	ctx.restore();
}

function textWidth(s, size) {
	ctx.save();
	ctx.font = "bold " + (size * k) + "px 'Hiragino Kaku Gothic ProN','Meiryo',sans-serif";
	const w = ctx.measureText(s).width / k;
	ctx.restore();
	return w;
}

function ball(x, y, r, col, ring) {
	ctx.save();
	ctx.fillStyle = col;
	ctx.beginPath();
	ctx.arc(x * k, y * k, r * k, 0, 2 * PI);
	ctx.fill();
	if (ring) {
		ctx.strokeStyle = "#ffffff";
		ctx.lineWidth = 2 * k;
		ctx.stroke();
	}
	ctx.restore();
}

// 関数 f(x) (x: 0〜1) を、左端 X0・右端 X1・中心線 CY・倍率 A で描く
function curve(f, X0, X1, CY, A, wid, col, alpha) {
	ctx.save();
	ctx.globalAlpha = (alpha === undefined) ? 1 : alpha;
	ctx.strokeStyle = col;
	ctx.lineWidth = wid * k;
	ctx.lineCap = "round";
	ctx.lineJoin = "round";
	ctx.beginPath();
	const N = 300;
	for (let i = 0; i <= N; i++) {
		const x = i / N;
		const px = (X0 + (X1 - X0) * x) * k, py = (CY - A * f(x)) * k;
		if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
	}
	ctx.stroke();
	ctx.restore();
}

// 閉管（左が閉じた端、右が開いた端）
function tube(X0, X1, CY) {
	rect(X0, CY - IN, X1 - X0, IN * 2, INNER);
	rect(X0 - WT, CY - IN - WT, X1 - X0 + WT, WT, TUBE);
	rect(X0 - WT, CY + IN, X1 - X0 + WT, WT, TUBE);
	rect(X0 - WT, CY - IN - WT, WT, IN * 2 + WT * 2, TUBE);
	line(X0, CY, X1, CY, 1.2, GRID, [6, 6]);
}

// スピーカー（開いた端の外側）
function speaker(x, y, active) {
	const col = active ? TEXT : "#cbbfb2";
	ctx.save();
	ctx.fillStyle = col;
	ctx.beginPath();
	ctx.moveTo((x + 34) * k, (y - 12) * k);
	ctx.lineTo((x + 46) * k, (y - 12) * k);
	ctx.lineTo((x + 46) * k, (y + 12) * k);
	ctx.lineTo((x + 34) * k, (y + 12) * k);
	ctx.closePath();
	ctx.fill();
	ctx.beginPath();
	ctx.moveTo((x + 34) * k, (y - 12) * k);
	ctx.lineTo((x + 14) * k, (y - 30) * k);
	ctx.lineTo((x + 14) * k, (y + 30) * k);
	ctx.lineTo((x + 34) * k, (y + 12) * k);
	ctx.closePath();
	ctx.fill();
	if (active && soundOn) {
		// 鳴っている印（管に向かう弧）
		ctx.strokeStyle = col;
		ctx.lineWidth = 3 * k;
		ctx.lineCap = "round";
		for (let i = 1; i <= 2; i++) {
			ctx.beginPath();
			ctx.arc((x + 14) * k, y * k, (10 * i) * k, PI * 0.72, PI * 1.28);
			ctx.stroke();
		}
	}
	ctx.restore();
}

/* ============================================================
   本体の描画
   ============================================================ */
function draw() {
	ctx.setTransform(1, 0, 0, 1, 0, 0);
	ctx.fillStyle = BG;
	ctx.fillRect(0, 0, cv.width, cv.height);
	ctx.setTransform(1, 0, 0, 1, 0, offY);

	const X0 = 330, X1 = VWv - 120;    // 閉端・開端
	const FS = 28;                      // 左の文字の大きさ

	// 一番上：管の長さ L
	const DY = 24;
	line(X0, DY - 12, X0, DY + 12, 2, TEXT);
	line(X1, DY - 12, X1, DY + 12, 2, TEXT);
	dimArrow(X0, X1, DY);
	const mid = (X0 + X1) / 2;
	rect(mid - 120, DY - 18, 240, 36, BG);
	text("管の長さ L", mid, DY, 24, TEXT, "center", true);
	text("閉じた端", X0 - WT, DY + 2, 20, SUB, "right", true);
	text("開いた端", X1 + 8, DY + 2, 20, SUB, "left", true);

	for (let i = 0; i < 4; i++) {
		const row = ROWS[i], CY = ROWY[i];
		const shown = (i < menu);
		tube(X0, X1, CY);
		speaker(X1, CY, menu === i + 1);
		if (i > 0) line(30, CY - 73, VWv - 30, CY - 73, 1, "#e3d9cd");

		// 左の文字
		const col = (row === 0) ? GREEN : WAVE;
		if (row === 0) {
			text("管の共鳴", 30, CY - 20, FS, col, "left", true);
			text("（下の3つの和）", 30, CY + 20, 20, col, "left", true);
		} else {
			text(row === 1 ? "基本振動" : row + "倍振動", 30, CY - 20, FS, col, "left", true);
			lambdaText(row, 30, CY + 22, 24);
			text(freqText(row), X0 - WT - 14, CY + 22, 20, SUB, "right", true);
		}
		if (!shown) continue;

		const f = function (x) { return disp(row, x); };

		// 節・腹（閉端は節、開端は腹。間は λ/4 ごとに交互）
		if (showNode && row > 0) {
			for (let j = 0; 2 * j <= row; j++) {
				const xn = X0 + (X1 - X0) * (2 * j) / row;
				line(xn, CY - IN, xn, CY + IN, 2, NODE, [4, 4]);
				ball(xn, CY, 8, NODE, true);
			}
			for (let j = 0; 2 * j + 1 <= row; j++) {
				const xa = X0 + (X1 - X0) * (2 * j + 1) / row;
				ball(xa, CY, 8, ANTI, true);
			}
		}

		if (tate) {
			// 空気の粒を左右に動かす（右向きの変位を正とする）
			curve(f, X0, X1, CY, AMP, 2, col, 0.25);
			for (let x0 = PSTEP / 2; x0 < 1; x0 += PSTEP) {
				const px = X0 + (X1 - X0) * x0 + AMP * f(x0);
				for (const dy of [-24, 24]) ball(px, CY + dy, 6, AIR);
			}
		} else {
			curve(f, X0, X1, CY, AMP, 4.5, col);
		}
	}

	if (showNode && menu >= 2) {
		ball(VWv - 300, VH - 140, 8, ANTI, true);
		text("腹", VWv - 286, VH - 140, 20, TEXT, "left", true);
		ball(VWv - 230, VH - 140, 8, NODE, true);
		text("節", VWv - 216, VH - 140, 20, TEXT, "left", true);
	}
	if (tate) text("縦波：空気の粒は管にそって左右に振動（うすい線は横波で表した変位）", 30, VH - 140, 18, SUB, "left", true);
}

// 両向き矢印の寸法線
function dimArrow(x1, x2, y) {
	line(x1, y, x2, y, 2, TEXT);
	ctx.save();
	ctx.fillStyle = TEXT;
	for (const [x, s] of [[x1, 1], [x2, -1]]) {
		ctx.beginPath();
		ctx.moveTo(x * k, y * k);
		ctx.lineTo((x + s * 16) * k, (y - 7) * k);
		ctx.lineTo((x + s * 16) * k, (y + 7) * k);
		ctx.closePath();
		ctx.fill();
	}
	ctx.restore();
}

// L = n × λ/4 を分数で書く（基本振動は λ/4）
function lambdaText(n, x, y, size) {
	const head = "L = " + (n === 1 ? "" : n);
	text(head, x, y, size, TEXT, "left", true);
	const fx = x + textWidth(head, size) + 4, fw = size * 0.9, fs = size * 0.8;
	text("λ", fx + fw / 2, y - size * 0.45, fs, TEXT, "center", true);
	line(fx, y, fx + fw, y, 2.5, TEXT);
	text("4", fx + fw / 2, y + size * 0.47, fs, TEXT, "center", true);
}

function freqText(n) {
	return (n === 1 ? "f₁" : n + "f₁") + " = " + Math.round(n * f1) + " Hz";
}

/* ============================================================
   音（Web Audio）
   ============================================================ */
let audioCtx = null, osc = null, gain = null;
let soundOn = false;

function soundSetup() {
	if (!osc) return;
	const row = ROWS[menu - 1];
	if (row === 0) {
		// 基本・3倍・5倍振動を同じ強さで重ねた音
		const real = new Float32Array(6), imag = new Float32Array(6);
		imag[1] = imag[3] = imag[5] = 1;
		osc.setPeriodicWave(audioCtx.createPeriodicWave(real, imag));
		osc.frequency.setTargetAtTime(f1, audioCtx.currentTime, 0.02);
	} else {
		osc.type = "sine";
		osc.frequency.setTargetAtTime(f1 * row, audioCtx.currentTime, 0.02);
	}
	gain.gain.setTargetAtTime(volume * 0.5, audioCtx.currentTime, 0.03);
}

function toggleSound() {
	try {
		if (soundOn) {
			soundOn = false;
			gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.03);
			const o = osc;
			setTimeout(function () { try { o.stop(); } catch (e) {} }, 200);
			osc = null;
		} else {
			if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
			if (audioCtx.state === "suspended") audioCtx.resume();
			osc = audioCtx.createOscillator();
			gain = audioCtx.createGain();
			gain.gain.value = 0;
			osc.connect(gain);
			gain.connect(audioCtx.destination);
			osc.start();
			soundOn = true;
			soundSetup();
		}
	} catch (e) { soundOn = false; }
	document.getElementById("bSound").classList.toggle("on", soundOn);
	document.getElementById("bSound").textContent = soundOn ? "🔊 音を止める" : "🔈 音を鳴らす";
	draw();
}

function changeVol() {
	volume = Number(document.getElementById("vol").value);
	document.getElementById("volVal").textContent = volume.toFixed(2);
	if (soundOn) soundSetup();
}

function changeFreq() {
	f1 = Number(document.getElementById("freq").value);
	document.getElementById("freqVal").textContent = f1 + " Hz";
	if (soundOn) soundSetup();
	draw();
}

/* ============================================================
   時間を進める
   ============================================================ */
function animate(now) {
	if (!lastNow) lastNow = now;
	const dt = Math.min(0.05, (now - lastNow) / 1000);
	lastNow = now;
	if (!paused) t += dt * spd;
	draw();
	requestAnimationFrame(animate);
}

/* ============================================================
   ボタン
   ============================================================ */
function stop()    { paused = !paused; }
function up()      { spd = Math.min(4, spd + 0.25); }
function down()    { spd = Math.max(0, spd - 0.25); }
function setMenu(n) { menu = n; t = 0; markButtons(); if (soundOn) soundSetup(); draw(); }
function toggleTate() { tate = !tate; markButtons(); draw(); }
function toggleNode() { showNode = !showNode; markButtons(); draw(); }
function markButtons() {
	for (let n = 1; n <= 4; n++) document.getElementById("m" + n).classList.toggle("on", menu === n);
	document.getElementById("bTate").classList.toggle("on", tate);
	document.getElementById("bNode").classList.toggle("on", showNode);
}
function buttonBack() { window.history.back(); }

/* ---------- 管をタップすると、その段まで表示して音もその段に ---------- */
cv.addEventListener("click", function (e) {
	const r = cv.getBoundingClientRect();
	const sy = (e.clientY - r.top) * (cv.height / r.height);
	const vy = (sy - offY) / k;
	for (let i = 0; i < 4; i++) {
		if (Math.abs(vy - ROWY[i]) < 70) { setMenu(i + 1); return; }
	}
});
document.addEventListener("touchmove", function (e) {
	if (e.target.tagName !== "INPUT") e.preventDefault();
}, { passive: false });
document.oncontextmenu = function () { return false; };

/* ---------- 開始 ---------- */
markButtons();
resize();
requestAnimationFrame(animate);
</script>
</body>
</html>
