<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>波の反射（反射の法則）</title>
<style>
* {
	-moz-user-select: none;
	-ms-user-select: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-appearance: none;
}
html, body {
	margin: 0;
	padding: 0;
	overflow: hidden;
	width: 100%;
	height: 100%;
	background-color: #faf4ee;
	font-family: "Hiragino Kaku Gothic ProN", "Meiryo", system-ui, sans-serif;
}
button, html, body, li { touch-action: manipulation; }

canvas#myCanvas {
	display: block;
	position: fixed;
	top: 0; left: 0;
	width: 100%;
	height: 100%;
	background-color: #faf4ee;
}

#info, #info2 {
	position: fixed;
	left: 0;
	width: 100%;
	display: flex;
	flex-wrap: wrap;
	justify-content: center;
	align-items: center;
	gap: 8px 14px;
	padding: 0 12px;
	box-sizing: border-box;
	color: #4a4038;
}
#info  { bottom: 9vh; }
#info2 { bottom: 2vh; }

.grp {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	padding: 4px 5px;
	background: rgba(74, 64, 56, 0.07);
	border-radius: 999px;
}

button, .val {
	font-family: inherit;
	font-size: clamp(11px, 1.32vw, 20px);
	font-weight: 600;
	letter-spacing: 0.02em;
	line-height: 1.15;
	white-space: nowrap;
}
button {
	appearance: none;
	-webkit-appearance: none;
	padding: 0.36em 0.95em;
	border: 0;
	border-radius: 999px;
	background: #fffdfa;
	color: #4a4038;
	cursor: pointer;
	box-shadow: 0 1px 2px rgba(90, 70, 50, 0.16);
	transition: background-color .16s ease, color .16s ease,
	            box-shadow .16s ease, transform .12s ease;
}
button:hover  { background: #ffffff; box-shadow: 0 3px 8px rgba(90, 70, 50, 0.22); }
button:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(90, 70, 50, 0.18); }
button:focus-visible { outline: 2px solid #8c7a66; outline-offset: 2px; }
button.on {
	background: #3f362e;
	color: #fff8f0;
	box-shadow: 0 3px 10px rgba(63, 54, 46, 0.34);
}
button.on:hover { background: #4a4038; }
.val { min-width: 5.6em; text-align: center; color: #3f362e; }
</style>
</head>
<body>

<canvas id="myCanvas"></canvas>

<div id="info">
	<span class="grp">
		<button onclick="setDeg(-5)">－</button>
		<span class="val" id="degVal">入射角 40°</span>
		<button onclick="setDeg(5)">＋</button>
	</span>
	<span class="grp">
		<button id="mo1" onclick="setMode(1)">波面の動き</button>
		<button id="mo2" onclick="setMode(2)">ホイヘンスの原理</button>
	</span>
	<button onclick="buttonBack()">戻る</button>
</div>

<div id="info2">
	<button id="rayBtn" onclick="toggleRay()">射線と角度</button>
	<span class="grp">
		<button onclick="stop()">停止／再開</button>
		<button onclick="up()">描画↑</button>
		<button onclick="down()">描画↓</button>
		<button onclick="restart()">最初から</button>
	</span>
</div>

<script>
"use strict";

/* ============================================================
   波の反射（反射の法則）
   参照: https://physics.cloudfree.jp/main/osci_wave/hansha_law-m/
   境界（水平）の上を波が進み、境界で反射する。平面波の「山」の波面を線で描く。

   ■ 波面の動き
     位相を距離に換算すると
       入射波  S(x, y) = x sinθ − y cosθ
       反射波  S′(x, y) = x sinθ + y cosθ   （境界で折り返した入射波）
     「S = s − kλ（k = 0, 1, 2 …）」を満たす直線が k 番目の山。
     s を時間とともに増やすと波面が進む（最初は画面外から入ってくる）。
     反射波も同じ s を使うので、入射波が境界に届いた所から順に現れる。

   ■ ホイヘンスの原理
     波面 AB の端 A が境界に届いてから、B が境界上の B′ に届くまでの間に、
     境界上の各点から素元波（半円）が広がる。
     同じ媒質なので A からの素元波の半径 AA′ は BB′ に等しい。
     B′ から引いた共通接線 A′B′ が反射波の波面になる。

   座標：仮想 1366 x 768 を基準に、画面の高さに合わせて拡大する
   （境界の中心 O を原点に、x は右、y は上を正にとって計算する）
   ============================================================ */

const cv  = document.getElementById("myCanvas");
const ctx = cv.getContext("2d");

const VH = 768;
const VWmin = 1100;
let k = 1, VWv = 1366, offY = 0;
let OX = 683;                   // 境界の中心 O の x（仮想座標）
const OY = 470;                 // 境界の高さ（反射波は上に戻るので、上を広くとる）
const FB = 650;                 // 図の下端（この下はボタン）

const PI = Math.PI, sin = Math.sin, cos = Math.cos;

const LAM   = 90;               // 波長 λ
const SPEED = 90;               // 速さ（1秒で1波長）

/* ---------- 色 ---------- */
const BG     = "#faf4ee";
const INK    = "#3f362e";
const SUB    = "#7a6e62";
const BLUE   = "#0060d0";       // 入射波
const RED    = "#e00000";       // 反射波
const ORANGE = "#e07000";       // 素元波

/* ---------- 状態 ---------- */
let deg = 40;                   // 入射角
let mode = 1;                   // 1:波面の動き 2:ホイヘンスの原理
let showRay = true;
let paused = false;
let speedMul = 1;
let D = 0;                      // 波面が進んだ距離
let hu = 0;                     // ホイヘンスの作図の経過時間

const H_PRE = 1.5, H_GROW = 5.0, H_HOLD = 5.0;
const HW = 520;                 // ホイヘンスの作図で使う AB′ の長さ

/* ============================================================
   画面サイズ
   ============================================================ */
function resize() {
	const dpr = Math.min(window.devicePixelRatio || 1, 2);
	const w = cv.clientWidth  || window.innerWidth;
	const h = cv.clientHeight || window.innerHeight;
	cv.width  = Math.round(w * dpr);
	cv.height = Math.round(h * dpr);
	k = Math.min(cv.height / VH, cv.width / VWmin);
	VWv = cv.width / k;
	offY = (cv.height - VH * k) / 2;
	OX = VWv / 2;
	draw();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", function () { setTimeout(resize, 300); });

function geom() {
	const th = deg * PI / 180;
	return { th, s1: sin(th), c1: cos(th) };
}

// 計算用の座標 → 画面（仮想）座標
function sx(x) { return OX + x; }
function sy(y) { return OY - y; }

/* ============================================================
   直線を長方形で切り取る（a x + b y = c）
   ============================================================ */
function clipLine(a, b, c, x0, x1, y0, y1) {
	const n2 = a * a + b * b;
	const len = Math.sqrt(n2);
	const px = a * c / n2, py = b * c / n2;
	const ux = -b / len, uy = a / len;
	let t0 = -1e6, t1 = 1e6;
	const P = [-ux, ux, -uy, uy];
	const Q = [px - x0, x1 - px, py - y0, y1 - py];
	for (let i = 0; i < 4; i++) {
		if (Math.abs(P[i]) < 1e-12) {
			if (Q[i] < 0) return null;
		} else {
			const r = Q[i] / P[i];
			if (P[i] < 0) { if (r > t1) return null; if (r > t0) t0 = r; }
			else          { if (r < t0) return null; if (r < t1) t1 = r; }
		}
	}
	if (t1 - t0 < 1e-6) return null;
	return [px + t0 * ux, py + t0 * uy, px + t1 * ux, py + t1 * uy];
}

function rangeOf(a, b, x0, x1, y0, y1) {
	const v = [a * x0 + b * y0, a * x0 + b * y1, a * x1 + b * y0, a * x1 + b * y1];
	return [Math.min.apply(null, v), Math.max.apply(null, v)];
}

// 位相 a x + b y = s − kλ の山を、領域の中に描く
function drawCrests(a, b, s, x0, x1, y0, y1, col, wid) {
	const mm = rangeOf(a, b, x0, x1, y0, y1);
	let c = s;
	if (c > mm[1]) c -= Math.floor((c - mm[1]) / LAM) * LAM;
	ctx.strokeStyle = col;
	ctx.lineWidth = wid;
	ctx.lineCap = "round";
	ctx.beginPath();
	for (; c >= mm[0]; c -= LAM) {
		const seg = clipLine(a, b, c, x0, x1, y0, y1);
		if (!seg) continue;
		ctx.moveTo(sx(seg[0]), sy(seg[1]));
		ctx.lineTo(sx(seg[2]), sy(seg[3]));
	}
	ctx.stroke();
}

/* ============================================================
   描画の小道具（すべて仮想座標）
   ============================================================ */
function line(x1, y1, x2, y2, col, wid, dash) {
	ctx.save();
	ctx.strokeStyle = col;
	ctx.lineWidth = wid;
	ctx.lineCap = "round";
	if (dash) ctx.setLineDash(dash);
	ctx.beginPath();
	ctx.moveTo(x1, y1);
	ctx.lineTo(x2, y2);
	ctx.stroke();
	ctx.restore();
}

function arrow(x1, y1, x2, y2, col, wid, dash) {
	const ang = Math.atan2(y2 - y1, x2 - x1);
	const hl = 8 + wid * 3.2, hw = 5 + wid * 2;
	const bx = x2 - hl * cos(ang), by = y2 - hl * sin(ang);
	line(x1, y1, bx, by, col, wid, dash);
	ctx.save();
	ctx.fillStyle = col;
	ctx.beginPath();
	ctx.moveTo(x2, y2);
	ctx.lineTo(bx - hw * sin(ang), by + hw * cos(ang));
	ctx.lineTo(bx + hw * sin(ang), by - hw * cos(ang));
	ctx.closePath();
	ctx.fill();
	ctx.restore();
}

function dot(x, y, r, col) {
	ctx.fillStyle = col;
	ctx.beginPath();
	ctx.arc(x, y, r, 0, 2 * PI);
	ctx.fill();
}

function label(text, x, y, col, size, align) {
	ctx.save();
	ctx.font = "700 " + (size || 22) + "px " + getComputedStyle(document.body).fontFamily;
	ctx.textAlign = align || "center";
	ctx.textBaseline = "middle";
	ctx.lineWidth = 5;
	ctx.strokeStyle = "rgba(250,244,238,0.9)";
	ctx.strokeText(text, x, y);
	ctx.fillStyle = col;
	ctx.fillText(text, x, y);
	ctx.restore();
}

// 角度の弧（画面の角度 a0 → a1）と文字
function angleArc(cx, cy, r, a0, a1, col, text) {
	ctx.save();
	ctx.strokeStyle = col;
	ctx.lineWidth = 2.5;
	ctx.beginPath();
	ctx.arc(cx, cy, r, a0, a1);
	ctx.stroke();
	ctx.restore();
	const am = (a0 + a1) / 2;
	label(text, cx + (r + 22) * cos(am), cy + (r + 22) * sin(am), col, 22);
}

// 左上の説明パネル
function textBox(lines, x, y) {
	if (!lines.length) return;
	ctx.save();
	const fam = getComputedStyle(document.body).fontFamily;
	ctx.font = "600 21px " + fam;
	let w = 0;
	for (const s of lines) w = Math.max(w, ctx.measureText(s).width);
	const lh = 32, pad = 14;
	const hgt = lines.length * lh + pad * 2 - 6;
	ctx.fillStyle = "rgba(255,253,250,0.93)";
	ctx.strokeStyle = "rgba(74,64,56,0.18)";
	ctx.lineWidth = 1.5;
	ctx.beginPath();
	if (ctx.roundRect) ctx.roundRect(x, y, w + pad * 2, hgt, 12);
	else ctx.rect(x, y, w + pad * 2, hgt);
	ctx.fill();
	ctx.stroke();
	ctx.fillStyle = INK;
	ctx.textBaseline = "top";
	lines.forEach(function (s, i) { ctx.fillText(s, x + pad, y + pad + i * lh); });
	ctx.restore();
}

/* ============================================================
   背景（境界の向こうは波が進めない壁）
   ============================================================ */
function drawStage() {
	ctx.setTransform(1, 0, 0, 1, 0, 0);
	ctx.fillStyle = BG;
	ctx.fillRect(0, 0, cv.width, cv.height);
	ctx.setTransform(k, 0, 0, k, 0, offY);

	ctx.save();
	ctx.beginPath();
	ctx.rect(0, OY, VWv, FB - OY);
	ctx.clip();
	ctx.fillStyle = "rgba(120, 105, 90, 0.09)";
	ctx.fillRect(0, OY, VWv, FB - OY);
	ctx.strokeStyle = "rgba(120, 105, 90, 0.30)";
	ctx.lineWidth = 1.2;
	const hgt = FB - OY;
	for (let x = -hgt; x < VWv; x += 20) {
		ctx.beginPath();
		ctx.moveTo(x, FB);
		ctx.lineTo(x + hgt, OY);
		ctx.stroke();
	}
	ctx.restore();
	line(0, OY, VWv, OY, INK, 4);
	label("境界（反射面）", 22, OY + 28, SUB, 20, "left");
}

/* ============================================================
   波面の動き
   ============================================================ */
function drawWaves(g) {
	const x0 = -OX, x1 = VWv - OX;
	const yTop = OY;

	// 波の先頭が左上の画面外から入ってくるように、始まりの位相を決める
	const s0 = rangeOf(g.s1, -g.c1, x0, x1, 0, yTop)[0] - 4;
	const s = s0 + D;

	drawCrests(g.s1, -g.c1, s, x0, x1, 0, yTop, BLUE, 4);
	drawCrests(g.s1,  g.c1, s, x0, x1, 0, yTop, RED, 4);

	if (showRay) drawRays(g);
}

function drawRays(g) {
	const R = 300;
	line(OX, 8, OX, OY, SUB, 2, [9, 8]);
	arrow(OX - R * g.s1, OY - R * g.c1, OX, OY, INK, 4);
	arrow(OX, OY, OX + R * g.s1, OY - R * g.c1, INK, 4);
	angleArc(OX, OY, 80, -PI / 2 - g.th, -PI / 2, BLUE, "θ");
	angleArc(OX, OY, 80, -PI / 2, -PI / 2 + g.th, RED, "θ′");
	textBox(["入射角 θ ＝ " + deg + "°", "反射角 θ′ ＝ " + deg + "°"], 16, 14);
}

/* ============================================================
   ホイヘンスの原理
   ============================================================ */
function drawHuygens(g) {
	const xA = -HW / 2, xE = HW / 2;
	const f = Math.max(0, Math.min(1, (hu - H_PRE) / H_GROW));
	const stage = (hu < H_PRE) ? 1 : (f < 1) ? 2 : 3;
	const X = xA + f * HW;                    // いま波面が境界に届いている点
	const L = HW * g.s1;                      // BB′ の長さ
	const Bx = xE - L * g.s1, By = L * g.c1;  // はじめの B
	const Px = Bx + f * L * g.s1, Py = By - f * L * g.c1;   // B が今いる点

	// はじめの波面 AB
	line(sx(xA), sy(0), sx(Bx), sy(By), BLUE, 3, stage === 1 ? null : [10, 8]);
	// 入射波の進む向き（B → B′）
	if (f > 0.02) arrow(sx(Bx), sy(By), sx(Px), sy(Py), BLUE, 2.5, [8, 7]);
	// いまの入射波面（まだ境界に届いていない部分）
	if (f < 1) line(sx(X), sy(0), sx(Px), sy(Py), BLUE, 5);

	// 素元波（境界の上側に半円）
	const src = [0, 1, 2, 3, 4].map(function (j) { return xA + j * HW / 5; });
	ctx.save();
	for (let j = 0; j < src.length; j++) {
		const xj = src[j];
		if (X <= xj) continue;
		const rho = (X - xj) * g.s1;
		ctx.strokeStyle = ORANGE;
		ctx.lineWidth = (j === 0) ? 3 : 1.8;
		ctx.globalAlpha = (j === 0) ? 1 : 0.75;
		ctx.beginPath();
		ctx.arc(sx(xj), sy(0), rho, PI, 2 * PI);
		ctx.stroke();
	}
	ctx.restore();
	for (const xj of src) if (X > xj || xj === xA) dot(sx(xj), sy(0), 5, ORANGE);

	// 反射波の波面 A′B′（B′ から素元波への接線）
	const r0 = (X - xA) * g.s1;
	const Qx = xA + r0 * g.s1, Qy = r0 * g.c1;
	if (f > 0) {
		arrow(sx(xA), sy(0), sx(Qx), sy(Qy), RED, 2.5, [8, 7]);
		line(sx(X), sy(0), sx(Qx), sy(Qy), RED, 5);
	}

	// 点と記号
	dot(sx(xA), sy(0), 7, INK);
	label("A", sx(xA) - 10, sy(0) + 28, INK, 24);
	dot(sx(Bx), sy(By), 6, INK);
	label("B", sx(Bx) + 4, sy(By) - 24, INK, 24);
	if (f > 0) dot(sx(Px), sy(Py), 6, BLUE);
	if (stage === 3) {
		dot(sx(xE), sy(0), 7, INK);
		label("B′", sx(xE) + 12, sy(0) + 28, INK, 24);
		dot(sx(Qx), sy(Qy), 7, INK);
		label("A′", sx(Qx) - 4, sy(Qy) - 26, INK, 24);
		// 境界と波面のなす角（＝入射角・反射角）
		angleArc(sx(xA), sy(0), 64, -g.th, 0, BLUE, "θ");
		angleArc(sx(xE), sy(0), 64, PI, PI + g.th, RED, "θ′");
		label("vt", sx((Bx + xE) / 2) + 26, sy(By / 2) - 4, BLUE, 22);
		label("vt", sx((xA + Qx) / 2) - 26, sy(Qy / 2) - 4, RED, 22);
	}

	let lines;
	if (stage === 1) {
		lines = ["① 波面 AB の端 A が、境界に届いた。"];
	} else if (stage === 2) {
		lines = ["② B が B′ まで進む時間 t のあいだに、",
		         "　境界の各点から素元波（半円）が広がる。",
		         "　同じ媒質なので、A からの素元波の半径 ＝ BB′ ＝ vt"];
	} else {
		lines = ["③ B′ から素元波に引いた接線 A′B′ が反射波の波面。",
		         "　直角三角形 ABB′ と B′A′A は、斜辺 AB′ が共通で BB′ ＝ AA′",
		         "　→ 合同なので 入射角 θ ＝ 反射角 θ′"];
	}
	textBox(lines, 16, 14);
}

/* ============================================================
   本体
   ============================================================ */
function draw() {
	const g = geom();
	drawStage();
	if (mode === 1) drawWaves(g);
	else            drawHuygens(g);
}

let lastT = null;
function animate(ts) {
	if (lastT === null) lastT = ts;
	const dt = Math.min(0.05, Math.max(0, (ts - lastT) / 1000));
	lastT = ts;
	if (!paused) step(dt);
	draw();
	requestAnimationFrame(animate);
}

function step(dt) {
	const d = dt * speedMul;
	D += SPEED * d;
	if (D > 12000) D -= Math.floor((D - 8000) / LAM) * LAM;   // 画面が埋まった後は位相を戻しても見た目は同じ
	hu += d;
	if (hu > H_PRE + H_GROW + H_HOLD) hu = 0;
}

/* ============================================================
   ボタン
   ============================================================ */
function setDeg(dd)   { deg = Math.max(10, Math.min(70, deg + dd)); markButtons(); }
function setMode(m)   { mode = m; hu = 0; markButtons(); }
function toggleRay()  { showRay = !showRay; markButtons(); }
function stop()       { paused = !paused; }
function up()         { speedMul = Math.min(4, speedMul + 0.25); }
function down()       { speedMul = Math.max(0, speedMul - 0.25); }
function restart()    { D = 0; hu = 0; paused = false; }
function buttonBack() { window.history.back(); }

function markButtons() {
	document.getElementById("degVal").textContent = "入射角 " + deg + "°";
	for (let n = 1; n <= 2; n++) document.getElementById("mo" + n).classList.toggle("on", mode === n);
	const rb = document.getElementById("rayBtn");
	rb.classList.toggle("on", showRay);
	rb.style.visibility = (mode === 1) ? "visible" : "hidden";
	draw();
}

/* ---------- 画面をタップしたら全画面 ---------- */
cv.addEventListener("click", function () {
	if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
		document.documentElement.requestFullscreen().catch(function () {});
	}
});
document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
document.oncontextmenu = function () { return false; };

/* ---------- 開始 ---------- */
resize();
markButtons();
requestAnimationFrame(animate);
</script>
</body>
</html>
