<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>波の反射（反射の法則）</title>
	<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
* {
	-moz-user-select: none;
	-ms-user-select: none;
	-khtml-user-select: none;
	-webkit-user-select: none;
	-webkit-touch-callout: none;
}
html, body {
	margin: 0;
	padding: 0;
	overflow: hidden;
	background-color: #003d3d;
}
button, html, body, li { touch-action: manipulation; }

#info_2 {
	position: fixed;
	left: 0vw;
	top: 40vh;
	margin: auto;
}
div#info_2 ul { padding-left: 0; list-style-type: none; text-align: left; }

#info {
	position: fixed;
	right: 0;
	top: 40vh;
	margin: auto;
}
div#info ul { list-style-type: none; text-align: right; }

button {
	list-style-type: none;
	margin-top: 0vh;
	margin-bottom: 4vh;
	margin-right: 0vw;
	margin-left: 0vw;
	background-color: #005050;
	border-style: none;
	color: white;
	font-size: 1.4vw;
	padding: 0.4em 0.9em;
	border-radius: 4px;
}
button.on { background-color: #00a0a0; color: #003030; }

#myCanvas {
	display: block;
	position: fixed;
	top: 0; left: 0;
	width: 100%;
	height: 100%;
	background-color: #003d3d;
}
</style>
</head>

<body>

<div id="info">
	<ul>
		<br>
		<li><button id="m1" onclick="menu1()">反射なし</button></li>
		<li><button id="m2" onclick="menu2()">自由端反射</button></li>
		<li><button id="m3" onclick="menu3()">固定端反射</button></li>
		<li><button id="theta1">入射角 小</button></li>
		<li><button id="theta2">入射角 大</button></li>
	</ul>
</div>

<div id="info_2">
	<ul>
		<li><button onclick="shinkouOn()">進行表示</button></li>
		<li><button onclick="shinkouOff()">進行消去</button></li>
		<li><button id="up">描画↑</button></li>
		<li><button id="down">描画↓</button></li>
		<li><button onclick="stop()">停止/再開</button></li>
		<li><button onclick="buttonBack()">　戻る　</button></li>
	</ul>
</div>

<canvas id="myCanvas"></canvas>

<script>
"use strict";

/* ============================================================
   波の反射（反射の法則）
   参照: https://physics.cloudfree.jp/main/osci_wave/hansha_law-m/
   を忠実に再現したもの（配色・メニュー構成・押しっぱなしで角度が
   変わる操作感・入射/反射の描き方をそのまま踏襲）。
   キャンバスの実サイズは画面幅に合わせて決め、その中で
   1366x768 を基準にした縮尺 kx, ky を使う（参照サイトの
   screen.width を使う方式は、ブラウザのタブで動かす都合上
   clientWidth/Height ベースに置き換えている）。
   ============================================================ */

const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

let wx = 0, wy = 0;      // キャンバスの実ピクセルサイズ
let kx = 1, ky = 1;      // 1366x768 基準からの縮尺
const wxo = 1366, wyo = 768;

function resizeCanvas() {
	const dpr = Math.min(window.devicePixelRatio || 1, 2);
	wx = Math.round((canvas.clientWidth || window.innerWidth) * dpr);
	wy = Math.round((canvas.clientHeight || window.innerHeight) * dpr);
	canvas.width = wx;
	canvas.height = wy;
	kx = wx / wxo;
	ky = wy / wyo;
}
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 300));

/* ---------- 状態 ---------- */
const pi = Math.PI;
let pause_flag = 0;
let z1 = [], z2 = [], z3 = [];
let th1 = pi / 4;
let menu = 1;
let shinkouLine = 0;
let num = 40;
let v, v0;
let ramda0, ramda2;
const n = 1;                 // 反射のみ扱うので媒質は変えない
let dy_kyoukai;               // 境界線を中心からどれだけ下げるか

let sin1, cos1, tan1, sin2, cos2, tan2, th2;

function kakudo() {
	sin1 = Math.sin(th1); cos1 = Math.cos(th1); tan1 = Math.tan(th1);
	sin2 = sin1 / n; cos2 = Math.sqrt(1 - sin2 * sin2); tan2 = sin2 / cos2;
	th2 = Math.atan(sin2 / cos2);
}

function hamen_sakusei() {
	if (menu === 1) {
		for (let i = 0; i < num; i++) z1[i] = ramda0 * (5 + i);
	} else {
		for (let i = 0; i < num; i++) z1[i] = ramda0 * (5 + i);
		for (let i = 0; i < num; i++) z2[i] = ramda2 * (5 + i);
		if (menu === 2) { for (let i = 0; i < num; i++) z3[i] = ramda2 * (-5 - i); }
		if (menu === 3) { for (let i = 0; i < num; i++) z3[i] = ramda2 * (-5 - i - 0.5); }
	}
}

function initParams() {
	v0 = (wy / 384) * 1.25;
	v = v0;
	ramda0 = wy / 12;
	ramda2 = ramda0 / n;
	dy_kyoukai = 100 * ky;
	kakudo();
	hamen_sakusei();
}

/* ---------- メニュー ---------- */
function menu1() { menu = 1; kakudo(); hamen_sakusei(); markButtons(); }
function menu2() { menu = 2; kakudo(); hamen_sakusei(); markButtons(); }
function menu3() { menu = 3; kakudo(); hamen_sakusei(); markButtons(); }

function markButtons() {
	document.getElementById("m1").classList.toggle("on", menu === 1);
	document.getElementById("m2").classList.toggle("on", menu === 2);
	document.getElementById("m3").classList.toggle("on", menu === 3);
}

function shinkouOn()  { shinkouLine = 1; }
function shinkouOff() { shinkouLine = 0; }
function buttonBack() { window.history.back(); }

let animId = null;
function stop() {
	if (pause_flag === 1) { pause_flag = 0; animId = requestAnimationFrame(animate); }
	else                  { pause_flag = 1; cancelAnimationFrame(animId); }
}

/* ---------- 押しっぱなしで変化するボタン（入射角・描画速度） ---------- */
function holdRepeat(el, fn) {
	let timer = null;
	const start = (e) => { e.preventDefault(); if (timer) return; fn(); timer = setInterval(fn, 50); };
	const stopHold = () => { clearInterval(timer); timer = null; };
	el.addEventListener("pointerdown", start);
	el.addEventListener("pointerup", stopHold);
	el.addEventListener("pointerleave", stopHold);
	el.addEventListener("pointercancel", stopHold);
}
holdRepeat(document.getElementById("theta1"), () => { th1 -= 0.02; if (th1 < 0) th1 = 0; kakudo(); });
holdRepeat(document.getElementById("theta2"), () => { th1 += 0.02; if (th1 > pi / 3) th1 = pi / 3; kakudo(); });
holdRepeat(document.getElementById("up"),   () => { v += 0.2; if (v > 6) v = 6; });
holdRepeat(document.getElementById("down"), () => { v -= 0.2; if (v < 0) v = 0; });

/* ---------- 描画 ---------- */
function fillRect2(cx, cy, dx, dy, th) {
	ctx.save();
	ctx.translate(cx, cy + dy_kyoukai);
	ctx.rotate(-th);
	ctx.fillRect(-dx / 2, -dy / 2, dx, dy);
	ctx.restore();
}

function animate() {
	animId = requestAnimationFrame(animate);

	ctx.fillStyle = "rgb(0, 51, 51)";
	ctx.fillRect(0, 0, wx, wy);

	if (menu === 2) { ctx.fillStyle = "rgb(0, 10, 10)"; ctx.fillRect(0, wy / 2 + dy_kyoukai, wx, wy); }
	if (menu === 3) { ctx.fillStyle = "rgb(0, 10, 10)"; ctx.fillRect(0, 0, wx, wy / 2 + dy_kyoukai); }

	ctx.strokeStyle = "rgb(255,255,255)";
	ctx.lineWidth = 0.5;
	ctx.beginPath(); ctx.moveTo(wx / 2, 0); ctx.lineTo(wx / 2, wy); ctx.stroke();
	ctx.beginPath(); ctx.moveTo(0, wy / 2 + dy_kyoukai); ctx.lineTo(wx, wy / 2 + dy_kyoukai); ctx.stroke();

	const LW = 8, LC = "rgb(255,0,0)";
	if (shinkouLine === 1) {
		ctx.strokeStyle = LC; ctx.lineWidth = LW;
		ctx.beginPath();
		ctx.moveTo(wx / 2, wy / 2 + dy_kyoukai);
		ctx.lineTo(wx / 2 - (wy / 2 + dy_kyoukai) * tan1, 0);
		ctx.stroke();
		ctx.beginPath();
		if (menu === 1) ctx.moveTo(wx / 2, wy / 2 + dy_kyoukai), ctx.lineTo(wx / 2 + (wy / 2 - dy_kyoukai) * tan1, wy);
		else            ctx.moveTo(wx / 2, wy / 2 + dy_kyoukai), ctx.lineTo(wx / 2 + (wy / 2 + dy_kyoukai) * tan2, 0);
		ctx.stroke();
	}

	if (menu === 1) {
		for (let i = 0; i < 35; i++) {
			z1[i] -= v;
			if (z1[i] < -15 * ramda0) z1[i] = 15 * ramda0 + z1[i] + 15 * ramda0;
			const x1 = -200 * kx, y1 = z1[i], x2 = 200 * kx, y2 = z1[i];
			const xx2 = x2 * cos1 - y2 * sin1, yy2 = x2 * sin1 + y2 * cos1;
			const xx1 = x1 * cos1 - y1 * sin1, yy1 = x1 * sin1 + y1 * cos1;
			const l = Math.hypot(xx1 - xx2, yy1 - yy2);
			ctx.fillStyle = "rgb(255,255,255)";
			fillRect2(wx / 2 + (xx2 + xx1) / 2, wy / 2 - (yy1 + yy2) / 2, l, 5 * kx, th1);
		}
	} else {
		for (let i = 0; i < 30; i++) {
			z1[i] -= v;
			if (z1[i] < -7 * ramda0) z1[i] = 23 * ramda0 + z1[i] + 7 * ramda0;
			const x1 = -200 * kx, y1 = z1[i], x2 = 200 * kx, y2 = z1[i];
			const xx2 = x2 * cos1 - y2 * sin1, yy2 = x2 * sin1 + y2 * cos1;
			if (yy2 >= 0) {
				let xx1 = x1 * cos1 - y1 * sin1, yy1 = x1 * sin1 + y1 * cos1;
				if (yy1 < 0) { xx1 = xx1 - yy1 / tan1; yy1 = 0; }
				const l = Math.hypot(xx1 - xx2, yy1 - yy2);
				ctx.fillStyle = "rgb(255,255,255)";
				fillRect2(wx / 2 + (xx2 + xx1) / 2, wy / 2 - (yy1 + yy2) / 2, l, 5 * kx, th1);
			}
		}
		for (let i = 0; i < 33; i++) {
			z2[i] -= v / n;
			if (z2[i] < -16 * ramda2) z2[i] = 7 * ramda2 + z2[i] + 16 * ramda2;
			const x1 = -200 * kx * cos2 / cos1, y1 = z2[i], x2 = 200 * kx * cos2 / cos1, y2 = z2[i];
			const xx1 = x1 * cos2 - y1 * sin2, yy1 = x1 * sin2 + y1 * cos2;
			if (yy1 <= 0) {
				let xx2 = x2 * cos2 - y2 * sin2, yy2 = x2 * sin2 + y2 * cos2;
				if (yy2 > 0) { xx2 = xx2 - yy2 / tan2; yy2 = 0; }
				const l = Math.hypot(xx1 - xx2, yy1 - yy2);
				ctx.fillStyle = menu === 2 ? "rgb(25,25,25)" : "rgb(0,43,43)";
				fillRect2(wx / 2 + (xx2 + xx1) / 2, wy / 2 - (yy1 + yy2) / 2, l, 5 * kx, th2);
			}
		}
		for (let i = 0; i < 130; i++) {
			z3[i] += v;
			if (z3[i] > 23 * ramda0) z3[i] = -7 * ramda0 + z3[i] - 23 * ramda0;
			const x1 = -200 * kx, y1 = z3[i], x2 = 200 * kx, y2 = z3[i];
			const xx1 = x1 * cos1 + y1 * sin1, yy1 = -x1 * sin1 + y1 * cos1;
			if (yy1 >= 0) {
				let xx2 = x2 * cos1 + y2 * sin1, yy2 = -x2 * sin1 + y2 * cos1;
				if (yy2 < 0) { xx2 = xx2 + yy2 / tan1; yy2 = 0; }
				const l = Math.hypot(xx1 - xx2, yy1 - yy2);
				ctx.fillStyle = "rgb(0,255,0)";
				fillRect2(wx / 2 + (xx2 + xx1) / 2, wy / 2 - (yy1 + yy2) / 2, l, 5 * kx, -th1);
			}
		}
	}
}

/* ---------- 開始 ---------- */
resizeCanvas();
initParams();
markButtons();
animId = requestAnimationFrame(animate);

document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.oncontextmenu = () => false;
</script>
</body>
</html>
